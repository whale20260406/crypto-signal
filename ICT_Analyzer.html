<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICT Analyzer</title>
<script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&display=swap');

  :root {
    --bg: #0a0a0f;
    --panel: #111118;
    --border: #1e1e2e;
    --accent: #00d4ff;
    --bull: #00e5a0;
    --bear: #ff4466;
    --text: #c8c8e0;
    --muted: #555570;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    flex-wrap: nowrap;
    overflow: hidden;
  }

  .logo {
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 2px;
    white-space: nowrap;
  }

  .symbol-btns {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .symbol-btns::-webkit-scrollbar { display: none; }

  .sym-btn {
    padding: 6px 12px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    font-family: 'Space Mono', monospace;
    transition: all 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .sym-btn:hover, .sym-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0,212,255,0.08);
  }

  .tf-btns {
    display: flex;
    gap: 4px;
    margin-left: auto;
    flex-shrink: 0;
  }
  .tf-btn {
    padding: 4px 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
    font-family: 'Space Mono', monospace;
    transition: all 0.15s;
  }
  .tf-btn:hover, .tf-btn.active {
    border-color: var(--bull);
    color: var(--bull);
    background: rgba(0,229,160,0.08);
  }

  .legend-bar {
    display: flex;
    gap: 12px;
    padding: 6px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    font-size: 11px;
    flex-wrap: wrap;
    align-items: center;
  }
  .leg-item {
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    opacity: 1;
    transition: opacity 0.2s;
    user-select: none;
  }
  .leg-item.off { opacity: 0.3; }
  .leg-box {
    width: 14px;
    height: 10px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .leg-label { color: var(--muted); font-size: 11px; white-space: nowrap; }

  #chart-container {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  #chart { width: 100%; height: 100%; }

  .bottom-panel {
    display: flex;
    background: var(--panel);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    height: 56px;
  }
  .stat-box {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-right: 1px solid var(--border);
    padding: 4px;
  }
  .stat-box:last-child { border-right: none; }
  .stat-label {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    font-family: 'Space Mono', monospace;
  }
  .stat-val {
    font-size: 13px;
    font-weight: 700;
    font-family: 'Space Mono', monospace;
    margin-top: 2px;
  }
  .bull { color: var(--bull); }
  .bear { color: var(--bear); }
  .neutral { color: var(--accent); }

  .price-overlay {
    position: absolute;
    top: 10px;
    left: 10px;
    font-family: 'Space Mono', monospace;
    pointer-events: none;
    z-index: 10;
  }
  .price-main {
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 20px rgba(0,212,255,0.3);
  }
  .price-change { font-size: 12px; margin-top: 2px; }

  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--bull);
    display: inline-block;
    margin-right: 4px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .signal-badge {
    display: none;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 6px;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    animation: badgePop 0.4s ease;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .signal-badge.show { display: flex; }
  .signal-badge.buy { background: rgba(0,229,160,0.15); border: 1px solid var(--bull); color: var(--bull); }
  .signal-badge.sell { background: rgba(255,68,102,0.15); border: 1px solid var(--bear); color: var(--bear); }
  .signal-badge.wait { background: rgba(0,212,255,0.08); border: 1px solid var(--accent); color: var(--accent); }

  .kz-badge {
    display: none;
    align-items: center;
    padding: 4px 10px;
    border-radius: 4px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .kz-badge.show { display: flex; }
  .kz-badge.london { background: rgba(255,120,0,0.15); border: 1px solid #ff7800; color: #ff7800; }
  .kz-badge.ny { background: rgba(255,200,0,0.15); border: 1px solid #ffc800; color: #ffc800; }

  .amd-badge {
    display: none;
    align-items: center;
    padding: 4px 10px;
    border-radius: 4px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    background: rgba(0,229,160,0.08);
    border: 1px solid rgba(0,229,160,0.4);
    color: var(--bull);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .amd-badge.show { display: flex; }

  @keyframes badgePop {
    0% { transform: scale(0.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">◈ ICT</div>
  <div class="symbol-btns">
    <button class="sym-btn active" onclick="changeSymbol('BTCUSDT',this)">BTC</button>
    <button class="sym-btn" onclick="changeSymbol('ETHUSDT',this)">ETH</button>
    <button class="sym-btn" onclick="changeSymbol('SOLUSDT',this)">SOL</button>
    <button class="sym-btn" onclick="changeSymbol('XRPUSDT',this)">XRP</button>
    <button class="sym-btn" onclick="changeSymbol('BNBUSDT',this)">BNB</button>
  </div>
  <div id="signalBadge" class="signal-badge wait show">⏳ 대기</div>
  <div id="kzBadge" class="kz-badge"></div>
  <div id="amdBadge" class="amd-badge"></div>
  <div class="tf-btns">
    <button class="tf-btn" onclick="changeTF('1m',this)">1m</button>
    <button class="tf-btn" onclick="changeTF('5m',this)">5m</button>
    <button class="tf-btn" onclick="changeTF('15m',this)">15m</button>
    <button class="tf-btn active" onclick="changeTF('1h',this)">1H</button>
    <button class="tf-btn" onclick="changeTF('4h',this)">4H</button>
    <button class="tf-btn" onclick="changeTF('1d',this)">1D</button>
  </div>
</div>

<div class="legend-bar">
  <div class="leg-item" id="leg-fvg-bull" onclick="toggleLayer('fvgBull')">
    <div class="leg-box" style="background:rgba(0,180,255,0.4);border:1px solid #00b4ff"></div>
    <span class="leg-label">강세 FVG</span>
  </div>
  <div class="leg-item" id="leg-fvg-bear" onclick="toggleLayer('fvgBear')">
    <div class="leg-box" style="background:rgba(255,200,0,0.4);border:1px solid #ffc800"></div>
    <span class="leg-label">약세 FVG</span>
  </div>
  <div class="leg-item" id="leg-ob-bull" onclick="toggleLayer('obBull')">
    <div class="leg-box" style="background:rgba(0,229,160,0.4);border:1px solid #00e5a0"></div>
    <span class="leg-label">강세 OB</span>
  </div>
  <div class="leg-item" id="leg-ob-bear" onclick="toggleLayer('obBear')">
    <div class="leg-box" style="background:rgba(255,68,102,0.4);border:1px solid #ff4466"></div>
    <span class="leg-label">약세 OB</span>
  </div>
  <div class="leg-item" id="leg-liq" onclick="toggleLayer('liq')">
    <div class="leg-box" style="background:rgba(180,130,255,0.4);border:1px solid #b482ff"></div>
    <span class="leg-label">유동성</span>
  </div>
  <div class="leg-item" id="leg-kz" onclick="toggleLayer('kz')">
    <div class="leg-box" style="background:linear-gradient(90deg,rgba(255,120,0,0.5) 50%,rgba(255,200,0,0.5) 50%);border:1px solid #888"></div>
    <span class="leg-label">킬존</span>
  </div>
  <div class="leg-item" id="leg-htf" onclick="toggleHTF()">
    <div class="leg-box" style="background:rgba(255,255,255,0.1);border:2px dashed #aaa"></div>
    <span class="leg-label">4H구간</span>
  </div>
  <div style="margin-left:auto;display:flex;align-items:center;font-size:11px;color:var(--muted)">
    <span class="status-dot"></span>LIVE
  </div>
</div>

<div id="chart-container">
  <div class="price-overlay">
    <div class="price-main" id="priceMain">--</div>
    <div class="price-change" id="priceChange">--</div>
  </div>
  <div id="chart"></div>
</div>

<div class="bottom-panel">
  <div class="stat-box">
    <div class="stat-label">FVG</div>
    <div class="stat-val neutral" id="statFVG">0</div>
  </div>
  <div class="stat-box">
    <div class="stat-label">OB</div>
    <div class="stat-val neutral" id="statOB">0</div>
  </div>
  <div class="stat-box">
    <div class="stat-label">유동성</div>
    <div class="stat-val neutral" id="statLiq">0</div>
  </div>
  <div class="stat-box">
    <div class="stat-label">구조</div>
    <div class="stat-val neutral" id="statMSS">-</div>
  </div>
  <div class="stat-box">
    <div class="stat-label">AMD</div>
    <div class="stat-val neutral" id="statAMD">-</div>
  </div>
  <div class="stat-box">
    <div class="stat-label">바이어스</div>
    <div class="stat-val neutral" id="statBias">-</div>
  </div>
</div>

<script>
// ─── STATE ────────────────────────────────────────────────
let chart, candleSeries;
let currentSymbol = 'BTCUSDT';
let currentTF = '1h';
let ws = null;
let candles = [];
let htfOn = true;
let openPrice = null;

let layers = { fvgBull: true, fvgBear: true, obBull: true, obBear: true, liq: true, kz: true };

// overlay storage
let fvgBullSeries=[], fvgBearSeries=[], obBullSeries=[], obBearSeries=[], kzSeries=[], liqLines=[];
// 4H overlay (priceLine 기반)
let htf4HLines = [];

// ─── CHART INIT ───────────────────────────────────────────
function initChart() {
  chart = LightweightCharts.createChart(document.getElementById('chart'), {
    layout: { background: { color: '#0a0a0f' }, textColor: '#c8c8e0' },
    grid: { vertLines: { color: '#1a1a2a' }, horzLines: { color: '#1a1a2a' } },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { borderColor: '#1e1e2e' },
    timeScale: { borderColor: '#1e1e2e', timezone: 'Asia/Seoul' },
    handleScroll: true,
    handleScale: true,
  });

  candleSeries = chart.addCandlestickSeries({
    upColor: '#00e5a0',
    downColor: '#ff4466',
    borderUpColor: '#00e5a0',
    borderDownColor: '#ff4466',
    wickUpColor: '#00e5a0',
    wickDownColor: '#ff4466',
  });

  window.addEventListener('resize', () => chart.resize(
    document.getElementById('chart').clientWidth,
    document.getElementById('chart').clientHeight
  ));
}

// ─── DATA ─────────────────────────────────────────────────
async function fetchCandles(symbol, tf) {
  const tfMap = { '1m':'1m','5m':'5m','15m':'15m','1h':'1h','4h':'4h','1d':'1d' };
  const interval = tfMap[tf] || '1h';
  const limit = 200;
  const binanceUrl = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=${limit}`;
  const proxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(binanceUrl)}`;

  try {
    let res = await fetch(binanceUrl);
    if (!res.ok) throw new Error();
    const data = await res.json();
    return data.map(k => ({
      time: k[0]/1000 + 9*3600,
      open: parseFloat(k[1]),
      high: parseFloat(k[2]),
      low:  parseFloat(k[3]),
      close:parseFloat(k[4]),
    }));
  } catch {
    try {
      let res = await fetch(proxy);
      const data = await res.json();
      return data.map(k => ({
        time: k[0]/1000 + 9*3600,
        open: parseFloat(k[1]),
        high: parseFloat(k[2]),
        low:  parseFloat(k[3]),
        close:parseFloat(k[4]),
      }));
    } catch { return []; }
  }
}

// ─── LOAD CHART ───────────────────────────────────────────
async function loadChart() {
  clearAll();
  candles = await fetchCandles(currentSymbol, currentTF);
  if (!candles.length) return;
  openPrice = candles[0].open;
  candleSeries.setData(candles);
  updatePrice(candles[candles.length-1]);
  analyzeAndDraw(candles);
  if (isLTF()) await draw4H();
  // 타임프레임별 적정 캔들 수만 보이도록
  const tfView = { '1m':120, '5m':100, '15m':80, '1h':60, '4h':60, '1d':60 };
  const viewCount = tfView[currentTF] || 60;
  const visible = candles.slice(-viewCount);
  if (visible.length >= 2) {
    chart.timeScale().setVisibleRange({ from: visible[0].time, to: visible[visible.length-1].time });
  }
  connectWS();
}

function isLTF() {
  return ['1m','5m','15m','1h'].includes(currentTF);
}

// ─── CLEAR ────────────────────────────────────────────────
function clearMain() {
  [...fvgBullSeries,...fvgBearSeries,...obBullSeries,...obBearSeries,...kzSeries].forEach(s => {
    if (s&&s.top) { try{chart.removeSeries(s.top);}catch(e){} }
    if (s&&s.bot) { try{chart.removeSeries(s.bot);}catch(e){} }
  });
  fvgBullSeries=[]; fvgBearSeries=[]; obBullSeries=[]; obBearSeries=[]; kzSeries=[];
  liqLines.forEach(l => { try{candleSeries.removePriceLine(l);}catch(e){} });
  liqLines=[];
}

function clearHTF() {
  htf4HLines.forEach(l => { try{candleSeries.removePriceLine(l);}catch(e){} });
  htf4HLines=[];
}

function clearAll() {
  clearMain();
  clearHTF();
}

// ─── PRICE LINE HELPER ────────────────────────────────────
function addPriceLine(price, color, width, style, label, labelVis=true) {
  return candleSeries.createPriceLine({
    price, color,
    lineWidth: width,
    lineStyle: style,
    axisLabelVisible: labelVis,
    title: label,
  });
}

// ─── BOX HELPER ───────────────────────────────────────────
function addBox(t1, t2, low, high, fillColor, lineColor, lw=2) {
  const topLine = chart.addLineSeries({
    color: lineColor, lineWidth: lw,
    lineStyle: LightweightCharts.LineStyle.Solid,
    lastValueVisible: false, priceLineVisible: false, crosshairMarkerVisible: false,
  });
  topLine.setData([{time:t1,value:high},{time:t2,value:high}]);

  const botLine = chart.addLineSeries({
    color: lineColor, lineWidth: lw,
    lineStyle: LightweightCharts.LineStyle.Solid,
    lastValueVisible: false, priceLineVisible: false, crosshairMarkerVisible: false,
  });
  botLine.setData([{time:t1,value:low},{time:t2,value:low}]);

  return { top: topLine, bot: botLine };
}

// ─── ICT ANALYSIS ─────────────────────────────────────────
function analyzeAndDraw(data) {
  clearMain();
  if (data.length < 5) return;

  const lastTime = data[data.length-1].time + 86400*7; // 7일 연장
  const D = LightweightCharts.LineStyle.Dashed;
  const S = LightweightCharts.LineStyle.Solid;

  // ── 킬존 ──────────────────────────────────────────────
  if (layers.kz) {
    const kzDefs = [
      { label:'런던', startH:16, endH:19, color:'rgba(255,120,0,0.08)', lc:'#ff7800' },
      { label:'뉴욕',  startH:22, endH:25, color:'rgba(255,200,0,0.08)', lc:'#ffc800' },
    ];
    data.forEach(c => {
      const d = new Date(c.time*1000);
      const h = (d.getUTCHours() + 9) % 24;
      kzDefs.forEach(kz => {
        const sh = kz.startH % 24, eh = kz.endH % 24;
        const inKZ = sh < eh ? (h >= sh && h < eh) : (h >= sh || h < eh);
        if (inKZ) {
          const s = addBox(c.time, c.time+3600, c.low*0.9995, c.high*1.0005, kz.color, kz.lc, 1);
          kzSeries.push(s);
        }
      });
    });
  }

  // ── FVG ───────────────────────────────────────────────
  const fvgBull=[], fvgBear=[];
  for (let i=1; i<data.length-1; i++) {
    const p=data[i-1], n=data[i+1];
    if (n.low > p.high) fvgBull.push({time:data[i].time, low:p.high, high:n.low});
    if (n.high < p.low) fvgBear.push({time:data[i].time, low:n.high, high:p.low});
  }

  if (layers.fvgBull) {
    fvgBull.slice(-3).forEach(f => {
      const s = addBox(f.time, lastTime, f.low, f.high, 'rgba(0,180,255,0.15)', '#00b4ff', 1);
      fvgBullSeries.push(s);
    });
  }
  if (layers.fvgBear) {
    fvgBear.slice(-3).forEach(f => {
      const s = addBox(f.time, lastTime, f.low, f.high, 'rgba(255,200,0,0.15)', '#ffc800', 1);
      fvgBearSeries.push(s);
    });
  }

  // ── OB ────────────────────────────────────────────────
  const obBull=[], obBear=[];
  for (let i=1; i<data.length-1; i++) {
    const c=data[i], n=data[i+1];
    if (c.close<c.open && n.close>n.open && n.close>c.high) obBull.push(c);
    if (c.close>c.open && n.close<n.open && n.close<c.low)  obBear.push(c);
  }

  // 현재가 아래 강세 OB
  const curPrice = data[data.length-1].close;
  const belowBull = obBull.filter(o=>o.high<curPrice).slice(-2);
  const aboveBear = obBear.filter(o=>o.low>curPrice).slice(-2);

  if (layers.obBull) {
    belowBull.forEach(o => {
      const s = addBox(o.time, lastTime, o.low, o.high, 'rgba(0,229,160,0.15)', '#00e5a0', 2);
      obBullSeries.push(s);
    });
  }
  if (layers.obBear) {
    aboveBear.forEach(o => {
      const s = addBox(o.time, lastTime, o.low, o.high, 'rgba(255,68,102,0.15)', '#ff4466', 2);
      obBearSeries.push(s);
    });
  }

  // ── 유동성 ────────────────────────────────────────────
  const lows=[...data].sort((a,b)=>a.low-b.low).slice(0,3);
  const highs=[...data].sort((a,b)=>b.high-a.high).slice(0,3);

  if (layers.liq) {
    highs.forEach(c => {
      const l = addPriceLine(c.high,'rgba(255,68,102,0.5)',1,LightweightCharts.LineStyle.Dashed,'↑ HH');
      liqLines.push(l);
    });
    lows.forEach(c => {
      const l = addPriceLine(c.low,'rgba(0,229,160,0.5)',1,LightweightCharts.LineStyle.Dashed,'↓ LL');
      liqLines.push(l);
    });
  }

  // ── 구조/바이어스 분석 ─────────────────────────────────
  const recent = data.slice(-30);
  let hh=0, ll=Infinity, hhIdx=0, llIdx=0;
  recent.forEach((c,i) => {
    if (c.high>hh) { hh=c.high; hhIdx=i; }
    if (c.low<ll)  { ll=c.low;  llIdx=i; }
  });
  const bias = llIdx > hhIdx ? '상승' : hhIdx > llIdx ? '하락' : '중립';

  // AMD / 킬존
  const nowUTC = new Date().getUTCHours();
  const nowKST = (nowUTC + 9) % 24;
  let amd = '-';
  if (nowKST>=9&&nowKST<12) amd='축적';
  else if (nowKST>=16&&nowKST<19) amd='조작';
  else if (nowKST>=22||nowKST<1) amd='배분';

  // 킬존 배지
  const kzBadge = document.getElementById('kzBadge');
  kzBadge.className = 'kz-badge';
  kzBadge.textContent = '';
  if (nowKST>=16&&nowKST<19) {
    kzBadge.classList.add('show','london');
    kzBadge.textContent='🇬🇧 런던 킬존';
  } else if (nowKST>=22||nowKST<1) {
    kzBadge.classList.add('show','ny');
    kzBadge.textContent='🇺🇸 뉴욕 킬존';
  }

  // AMD 배지
  const amdBadge = document.getElementById('amdBadge');
  amdBadge.className = 'amd-badge';
  if (amd!=='-') {
    amdBadge.classList.add('show');
    amdBadge.textContent = amd;
  }

  // 신호
  const sig = document.getElementById('signalBadge');
  sig.className = 'signal-badge';
  if (belowBull.length && bias==='상승') {
    sig.classList.add('show','buy'); sig.textContent='● 매수';
  } else if (aboveBear.length && bias==='하락') {
    sig.classList.add('show','sell'); sig.textContent='● 매도';
  } else {
    sig.classList.add('show','wait'); sig.textContent='⏳ 대기';
  }

  // 하단 스탯
  document.getElementById('statFVG').textContent = fvgBull.length+fvgBear.length;
  document.getElementById('statOB').textContent = obBull.length+obBear.length;
  document.getElementById('statLiq').textContent = lows.length+highs.length;

  const mssEl = document.getElementById('statMSS');
  const mssText = bias==='상승'?'상승':bias==='하락'?'하락':'중립';
  mssEl.textContent = mssText;
  mssEl.className = 'stat-val ' + (bias==='상승'?'bull':bias==='하락'?'bear':'neutral');

  const amdEl = document.getElementById('statAMD');
  amdEl.textContent = amd;
  amdEl.className = 'stat-val ' + (amd==='배분'?'bull':amd==='조작'?'bear':'neutral');

  const biasEl = document.getElementById('statBias');
  const biasText = bias==='상승'?'매수':bias==='하락'?'매도':'중립';
  biasEl.textContent = biasText;
  biasEl.className = 'stat-val '+(bias==='상승'?'bull':bias==='하락'?'bear':'neutral');
}

// ─── 4H OVERLAY ───────────────────────────────────────────
async function draw4H() {
  clearHTF();
  try {
    const htfData = await fetchCandles(currentSymbol, '4h');
    if (!htfData || htfData.length < 5) return;

    const recent = htfData.slice(-20);
    const D = LightweightCharts.LineStyle.Dashed;

    for (let i=1; i<recent.length-1; i++) {
      const p=recent[i-1], c=recent[i], n=recent[i+1];

      // 강세 OB
      if (c.close<c.open && n.close>n.open && n.close>c.high) {
        const lH = addPriceLine(c.high,'#00e5a0',2,D,'4H 강세OB');
        const lL = addPriceLine(c.low,'#00e5a0',2,D,'',false);
        htf4HLines.push(lH, lL);
      }
      // 약세 OB
      if (c.close>c.open && n.close<n.open && n.close<c.low) {
        const lH = addPriceLine(c.high,'#ffc800',2,D,'4H 약세OB');
        const lL = addPriceLine(c.low,'#ffc800',2,D,'',false);
        htf4HLines.push(lH, lL);
      }
      // 강세 FVG
      if (n.low > p.high) {
        const mid = (n.low+p.high)/2;
        const l = addPriceLine(mid,'#00b4ff',2,D,'4H FVG');
        htf4HLines.push(l);
      }
      // 약세 FVG
      if (n.high < p.low) {
        const mid = (n.high+p.low)/2;
        const l = addPriceLine(mid,'#ffc800',2,D,'4H FVG');
        htf4HLines.push(l);
      }
    }
  } catch(e) { console.warn('4H error:', e); }
}

// ─── WEBSOCKET ────────────────────────────────────────────
function connectWS() {
  if (ws) ws.close();
  const sym = currentSymbol.toLowerCase();
  ws = new WebSocket(`wss://stream.binance.com:9443/ws/${sym}@kline_${currentTF}`);
  ws.onmessage = async (e) => {
    const d = JSON.parse(e.data).k;
    const candle = {
      time: d.t/1000 + 9*3600,
      open: parseFloat(d.o),
      high: parseFloat(d.h),
      low:  parseFloat(d.l),
      close:parseFloat(d.c),
    };
    candleSeries.update(candle);
    updatePrice(candle);
    if (d.x) {
      candles.push(candle);
      if (candles.length > 300) candles.shift();
      analyzeAndDraw(candles);
      if (isLTF() && htfOn) await draw4H();
    }
  };
}

// ─── PRICE DISPLAY ────────────────────────────────────────
function updatePrice(candle) {
  const el = document.getElementById('priceMain');
  const chEl = document.getElementById('priceChange');
  const price = candle.close;
  el.textContent = price > 1000
    ? price.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})
    : price.toFixed(4);
  if (openPrice) {
    const chg = ((price-openPrice)/openPrice*100).toFixed(2);
    chEl.textContent = (chg>=0?'+':'')+chg+'%';
    chEl.style.color = chg>=0?'#00e5a0':'#ff4466';
  }
}

// ─── CONTROLS ─────────────────────────────────────────────
function changeSymbol(sym, btn) {
  document.querySelectorAll('.sym-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentSymbol = sym;
  loadChart();
}

function changeTF(tf, btn) {
  document.querySelectorAll('.tf-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentTF = tf;
  loadChart();
}

function toggleHTF() {
  htfOn = !htfOn;
  const el = document.getElementById('leg-htf');
  if (el) el.classList.toggle('off', !htfOn);
  if (htfOn && isLTF()) draw4H();
  else clearHTF();
}

function toggleLayer(name) {
  layers[name] = !layers[name];
  const legMap = {
    fvgBull:'leg-fvg-bull', fvgBear:'leg-fvg-bear',
    obBull:'leg-ob-bull', obBear:'leg-ob-bear',
    liq:'leg-liq', kz:'leg-kz',
  };
  const el = document.getElementById(legMap[name]);
  if (el) el.classList.toggle('off', !layers[name]);
  analyzeAndDraw(candles);
  if (htfOn && isLTF()) draw4H();
}

// ─── INIT ─────────────────────────────────────────────────
initChart();
loadChart();
</script>

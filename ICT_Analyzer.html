<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICT Analyzer</title>
<script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&display=swap');

  :root {
    --bg: #0a0a0f;
    --panel: #111118;
    --border: #1e1e2e;
    --accent: #00d4ff;
    --bull: #00e5a0;
    --bear: #ff4466;
    --text: #c8c8e0;
    --muted: #555570;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    flex-wrap: nowrap;
    overflow: hidden;
  }

  .logo {
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 2px;
    white-space: nowrap;
  }

  .symbol-btns {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    min-width: 0; /* 이게 없으면 flex 아이템이 내용물 크기 밑으로 안 줄어들어서
                     overflow-x:auto가 무용지물이 되고, 대신 뒤에 있는
                     tf-btns(1m~1D)가 화면 밖으로 밀려 잘리는 문제가 있었음 */
  }
  .symbol-btns::-webkit-scrollbar { display: none; }

  .sym-btn {
    padding: 6px 12px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    font-family: 'Space Mono', monospace;
    transition: all 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .sym-btn:hover, .sym-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0,212,255,0.08);
  }

  .tf-btns {
    display: flex;
    gap: 4px;
    margin-left: auto;
    flex-shrink: 0;
  }
  .tf-btn {
    padding: 4px 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
    font-family: 'Space Mono', monospace;
    transition: all 0.15s;
  }
  .tf-btn:hover, .tf-btn.active {
    border-color: var(--bull);
    color: var(--bull);
    background: rgba(0,229,160,0.08);
  }

  .legend-bar {
    display: flex;
    gap: 12px;
    padding: 6px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    font-size: 11px;
    flex-wrap: wrap;
    align-items: center;
  }
  .leg-item {
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    opacity: 1;
    transition: opacity 0.2s;
    user-select: none;
  }
  .leg-item.off { opacity: 0.3; }
  .leg-box {
    width: 14px;
    height: 10px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .leg-label { color: var(--muted); font-size: 11px; white-space: nowrap; }

  #chart-container {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  #chart { width: 100%; height: 100%; }

  .bottom-panel {
    display: flex;
    background: var(--panel);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    height: 56px;
  }
  .stat-box {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-right: 1px solid var(--border);
    padding: 4px;
  }
  .stat-box:last-child { border-right: none; }
  .stat-label {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    font-family: 'Space Mono', monospace;
  }
  .stat-val {
    font-size: 13px;
    font-weight: 700;
    font-family: 'Space Mono', monospace;
    margin-top: 2px;
  }
  .bull { color: var(--bull); }
  .bear { color: var(--bear); }
  .neutral { color: var(--accent); }

  .price-overlay {
    position: absolute;
    top: 10px;
    left: 10px;
    font-family: 'Space Mono', monospace;
    pointer-events: none;
    z-index: 10;
  }
  .price-main {
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 20px rgba(0,212,255,0.3);
  }
  .price-change { font-size: 12px; margin-top: 2px; }

  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--bull);
    display: inline-block;
    margin-right: 4px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .signal-badge {
    display: none;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 6px;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    animation: badgePop 0.4s ease;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .signal-badge.show { display: flex; }
  .signal-badge.buy { background: rgba(0,229,160,0.15); border: 1px solid var(--bull); color: var(--bull); }
  .signal-badge.sell { background: rgba(255,68,102,0.15); border: 1px solid var(--bear); color: var(--bear); }
  .signal-badge.wait { background: rgba(0,212,255,0.08); border: 1px solid var(--accent); color: var(--accent); }

  .kz-badge {
    display: none;
    align-items: center;
    padding: 4px 10px;
    border-radius: 4px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .kz-badge.show { display: flex; }
  .kz-badge.london { background: rgba(255,120,0,0.15); border: 1px solid #ff7800; color: #ff7800; }
  .kz-badge.ny { background: rgba(255,200,0,0.15); border: 1px solid #ffc800; color: #ffc800; }

  .amd-badge {
    display: none;
    align-items: center;
    padding: 4px 10px;
    border-radius: 4px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    background: rgba(0,229,160,0.08);
    border: 1px solid rgba(0,229,160,0.4);
    color: var(--bull);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .amd-badge.show { display: flex; }

  @keyframes badgePop {
    0% { transform: scale(0.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">◈ ICT</div>
  <div class="symbol-btns">
    <button class="sym-btn active" onclick="changeSymbol('BTCUSDT',this)">BTC</button>
    <button class="sym-btn" onclick="changeSymbol('ETHUSDT',this)">ETH</button>
    <button class="sym-btn" onclick="changeSymbol('SOLUSDT',this)">SOL</button>
    <button class="sym-btn" onclick="changeSymbol('XRPUSDT',this)">XRP</button>
    <button class="sym-btn" onclick="changeSymbol('BNBUSDT',this)">BNB</button>
  </div>
  <div id="signalBadge" class="signal-badge wait show">⏳ 대기</div>
  <div class="tf-btns">
    <button class="tf-btn" onclick="changeTF('1m',this)">1m</button>
    <button class="tf-btn" onclick="changeTF('5m',this)">5m</button>
    <button class="tf-btn" onclick="changeTF('15m',this)">15m</button>
    <button class="tf-btn active" onclick="changeTF('1h',this)">1H</button>
    <button class="tf-btn" onclick="changeTF('4h',this)">4H</button>
    <button class="tf-btn" onclick="changeTF('1d',this)">1D</button>
  </div>
</div>

<div class="legend-bar">
  <div class="leg-item" id="leg-fvg-bull" onclick="toggleLayer('fvgBull')">
    <div class="leg-box" style="background:rgba(0,180,255,0.4);border:1px solid #00b4ff"></div>
    <span class="leg-label">강세 FVG</span>
  </div>
  <div class="leg-item" id="leg-fvg-bear" onclick="toggleLayer('fvgBear')">
    <div class="leg-box" style="background:rgba(255,200,0,0.4);border:1px solid #ffc800"></div>
    <span class="leg-label">약세 FVG</span>
  </div>
  <div class="leg-item" id="leg-ob-bull" onclick="toggleLayer('obBull')">
    <div class="leg-box" style="background:rgba(0,229,160,0.4);border:1px solid #00e5a0"></div>
    <span class="leg-label">강세 OB</span>
  </div>
  <div class="leg-item" id="leg-ob-bear" onclick="toggleLayer('obBear')">
    <div class="leg-box" style="background:rgba(255,68,102,0.4);border:1px solid #ff4466"></div>
    <span class="leg-label">약세 OB</span>
  </div>
  <div class="leg-item" id="leg-liq" onclick="toggleLayer('liq')">
    <div class="leg-box" style="background:rgba(180,130,255,0.4);border:1px solid #b482ff"></div>
    <span class="leg-label">유동성</span>
  </div>

  <div style="margin-left:auto;display:flex;align-items:center;font-size:11px;color:var(--muted)">
    <span class="status-dot"></span>LIVE
  </div>
</div>

<div id="chart-container">
  <div class="price-overlay">
    <div class="price-main" id="priceMain">--</div>
    <div class="price-change" id="priceChange">--</div>
  </div>
  <div id="debugInfo" style="position:absolute; top:4px; left:4px; z-index:999; background:rgba(0,0,0,0.75); color:#00ff88; font-family:monospace; font-size:11px; padding:4px 8px; border-radius:4px; pointer-events:none; white-space:pre; line-height:1.5;"></div>
  <div id="chart"></div>
</div>

<div class="bottom-panel">
  <div class="stat-box">
    <div class="stat-label">FVG</div>
    <div class="stat-val neutral" id="statFVG">0</div>
  </div>
  <div class="stat-box">
    <div class="stat-label">OB</div>
    <div class="stat-val neutral" id="statOB">0</div>
  </div>
  <div class="stat-box">
    <div class="stat-label">유동성</div>
    <div class="stat-val neutral" id="statLiq">0</div>
  </div>
  <div class="stat-box">
    <div class="stat-label">구조</div>
    <div class="stat-val neutral" id="statMSS">-</div>
  </div>
  <div class="stat-box">
    <div class="stat-label">AMD</div>
    <div class="stat-val neutral" id="statAMD">-</div>
  </div>
  <div class="stat-box">
    <div class="stat-label">바이어스</div>
    <div class="stat-val neutral" id="statBias">-</div>
  </div>
</div>

<script>
// ─── STATE ────────────────────────────────────────────────
let chart, candleSeries;
let currentSymbol = 'BTCUSDT';
let currentTF = '1h';
let ws = null;
let wsReconnectTimer = null;
let candles = [];
let htfOn = false;
let openPrice = null;
let userScrollPos = null;  // 사용자 스크롤 위치 (픽셀)
let isUserScrolled = false; // 사용자가 스크롤 했는지

let layers = { fvgBull: true, fvgBear: true, obBull: true, obBear: true, liq: true };

// overlay storage
let fvgBullSeries=[], fvgBearSeries=[], obBullSeries=[], obBearSeries=[], liqLines=[];
// 4H overlay (priceLine 기반)
let htf4HLines = [];

// ─── CHART INIT ───────────────────────────────────────────
function initChart() {
  chart = LightweightCharts.createChart(document.getElementById('chart'), {
    layout: { background: { color: '#0a0a0f' }, textColor: '#c8c8e0' },
    grid: { vertLines: { color: '#1a1a2a' }, horzLines: { color: '#1a1a2a' } },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { borderColor: '#1e1e2e' },
    timeScale: { borderColor: '#1e1e2e', timezone: 'Asia/Seoul', rightOffset: 8, barSpacing: 6, lockVisibleTimeRangeOnResize: true, shiftVisibleRangeOnNewBar: false, fixLeftEdge: false, fixRightEdge: false },
    handleScroll: true,
    handleScale: true,
  });

  candleSeries = chart.addCandlestickSeries({
    upColor: '#00e5a0',
    downColor: '#ff4466',
    borderUpColor: '#00e5a0',
    borderDownColor: '#ff4466',
    wickUpColor: '#00e5a0',
    wickDownColor: '#ff4466',
  });

  window.addEventListener('resize', () => chart.resize(
    document.getElementById('chart').clientWidth,
    document.getElementById('chart').clientHeight
  ));

  // createChart()는 생성되는 그 순간의 컨테이너 크기를 내부 캔버스 크기로
  // 굳혀버리고, 이후로는 "브라우저 창 자체의 resize 이벤트"가 실제로 발생할
  // 때만 다시 맞춰준다. 그런데 페이지가 막 로드되는 시점엔 flex 레이아웃이
  // 아직 최종 크기로 자리잡기 전일 수 있어서, 그 순간에 좁게 굳어버리면
  // 시간봉 버튼을 누르거나 새로고침을 해도(둘 다 window resize 이벤트가
  // 아님) 절대 재계산되지 않아 캔들이 오른쪽으로 몰려 보이는 문제가 있었음.
  // ResizeObserver는 "창 크기"가 아니라 "이 엘리먼트 자체의 실제 크기"가
  // 바뀔 때마다 감지하므로, 레이아웃이 뒤늦게 자리잡는 경우까지 커버된다.
  const chartEl = document.getElementById('chart');
  const ro = new ResizeObserver(() => {
    applyFit();
  });
  ro.observe(chartEl);

  // 사용자가 차트 건드리면 위치 저장
  chart.timeScale().subscribeVisibleLogicalRangeChange(() => {
    if (!_codeUpdating) {
      userScrollPos = chart.timeScale().getVisibleLogicalRange();
      isUserScrolled = true;
    }
  });
}

let _codeUpdating = false;

// fitContent()나 scrollToPosition() 같은 "알아서 맞춰주는" 함수를 전혀
// 믿지 않고, 보여줄 범위를 인덱스로 직접, 명시적으로 지정한다.
// (barSpacing만 바꾸고 scrollToPosition()에 맡겼던 이전 시도도 여전히
// 안 맞았어서, 아예 범위 자체를 숫자로 못박아버리는 방식으로 바꿈)
function applyFit() {
  const el = document.getElementById('chart');
  chart.resize(el.clientWidth, el.clientHeight);
  if (candles.length > 0) {
    const priceScaleWidth = 70;
    const usablePx = Math.max(el.clientWidth - priceScaleWidth, 100);
    const spacing = Math.max(2, Math.min(30, usablePx / (candles.length + 8)));
    chart.timeScale().applyOptions({ barSpacing: spacing, rightOffset: 8 });
    // "몇 번째 캔들부터 몇 번째까지 보여줘"를 좌표(인덱스)로 직접 지정.
    // 0번이 제일 오래된 캔들, candles.length-1이 제일 최신 캔들.
    // 오른쪽에 8칸 여백을 더해서 to를 그만큼 늘려준다.
    chart.timeScale().setVisibleLogicalRange({
      from: 0,
      to: candles.length - 1 + 8,
    });
  } else {
    chart.timeScale().fitContent();
  }
}

// ─── SCROLL RESTORE ───────────────────────────────────────
function saveAndRestore(fn) {
  _codeUpdating = true;
  fn();
  setTimeout(() => { _codeUpdating = false; }, 50);
}

// ─── DATA ─────────────────────────────────────────────────
let _debugFetchInfo = { source: '-', count: 0, error: null };

async function fetchCandlesOnce(symbol, tf) {
  const tfMap = { '1m':'1m','5m':'5m','15m':'15m','1h':'1h','4h':'4h','1d':'1d' };
  const interval = tfMap[tf] || '1h';
  const limit = 200;
  const binanceUrl = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=${limit}`;

  // api.binance.com은 브라우저 직접 호출 시 CORS로 막히는 경우가 흔하고,
  // 무료 프록시는 하나만 쓰면 그 프록시 자체의 분당/시간당 한도에 걸릴 수
  // 있음 (특히 지금처럼 새로고침을 반복 테스트한 경우). 서로 다른 무료
  // 프록시 여러 개를 순서대로 시도해서, 하나가 막혀도 다음 걸로 넘어가게
  // 한다. 각 URL 형식은 서비스마다 달라서 하나씩 시도해보고 실패하면 다음.
  const attempts = [
    { name: 'direct', url: binanceUrl },
    { name: 'codetabs', url: `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(binanceUrl)}` },
    { name: 'x2u', url: `https://cors.x2u.in/${binanceUrl}` },
    { name: 'allorigins', url: `https://api.allorigins.win/raw?url=${encodeURIComponent(binanceUrl)}` },
  ];

  const errors = [];
  for (const attempt of attempts) {
    try {
      const res = await fetch(attempt.url);
      if (!res.ok) throw new Error('http ' + res.status);
      const data = await res.json();
      if (!Array.isArray(data) || !data.length) throw new Error('bad shape');
      _debugFetchInfo = { source: attempt.name, count: data.length, error: errors.length ? errors.join(' | ') : null };
      return data.map(k => ({
        time: k[0]/1000,
        open: parseFloat(k[1]),
        high: parseFloat(k[2]),
        low:  parseFloat(k[3]),
        close:parseFloat(k[4]),
      }));
    } catch (e) {
      errors.push(`${attempt.name}: ${e.message}`);
    }
  }
  _debugFetchInfo = { source: '실패', count: 0, error: errors.join(' | ') };
  return [];
}

// 새로고침 직후(콜드 스타트)엔 프록시가 불안정하거나 첫 요청이 유독 실패하는
// 경우가 있어서, 받아온 캔들이 기대치(200개)보다 눈에 띄게 적으면 조금 있다가
// 한 번 더 시도해본다. 데이터가 적게 오면 fitContent()가 "적은 데이터에 맞게"
// 정상적으로 동작한 것뿐이라도, 화면엔 오른쪽에 몰려 보이는 것처럼 보일 수 있음.
async function fetchCandles(symbol, tf) {
  let result = await fetchCandlesOnce(symbol, tf);
  if (result.length < 100) {
    await new Promise(r => setTimeout(r, 500));
    const retry = await fetchCandlesOnce(symbol, tf);
    if (retry.length > result.length) result = retry;
  }
  return result;
}

// ─── LOAD CHART ───────────────────────────────────────────
// 심볼/TF를 빠르게 연속으로 바꾸면 fetchCandles()가 여러 개 동시에 날아가고,
// 먼저 시작했지만 나중에 응답이 오는 요청이 최신 차트를 오래된 데이터로 덮어써서
// "가짜차트"가 잠깐 보이고, 그 뒤 실시간 캔들이 시간 역행 업데이트를 시도하면서
// "Cannot update oldest data" 에러가 났었음. 요청마다 토큰을 발급해서
// 가장 마지막에 시작한 요청의 결과만 반영하도록 막는다.
let _loadToken = 0;
async function loadChart() {
  const myToken = ++_loadToken;
  clearAll();
  const fetched = await fetchCandles(currentSymbol, currentTF);
  // 기다리는 동안 더 최신 loadChart()가 시작됐다면 이 결과는 낡은 것이므로 버림
  if (myToken !== _loadToken) return;
  candles = fetched;
  if (!candles.length) {
    const dbg = document.getElementById('debugInfo');
    if (dbg) dbg.textContent = `캔들:0 소스:${_debugFetchInfo.source} ${_debugFetchInfo.error || ''}`;
    return;
  }
  openPrice = candles[0].open;
  candleSeries.setData(candles);
  // barSpacing과 보여줄 범위를 직접 계산해서 강제 적용 (fitContent() 안 씀)
  applyFit();
  updatePrice(candles[candles.length-1]);
  analyzeAndDraw(candles);
  connectWS();
  {
    const el = document.getElementById('chart');
    const dbg = document.getElementById('debugInfo');
    if (dbg) {
      const opts = chart.timeScale().options();
      const range = chart.timeScale().getVisibleLogicalRange();
      dbg.textContent =
        `캔들:${candles.length} 소스:${_debugFetchInfo.source} 폭:${el.clientWidth}px ` +
        `간격:${opts.barSpacing?.toFixed(1)} 범위:${range ? range.from.toFixed(0)+'~'+range.to.toFixed(0) : '-'}`;
    }
  }

  // 안전망: 웹폰트가 늦게 로드되어 상단 바 높이가 미세하게 바뀌는 등,
  // 로드 후에도 레이아웃이 뒤늦게 한 번 더 흔들리는 경우가 있어서,
  // 몇 차례 더 재확인하고 다시 맞춘다.
  // (그 사이 다른 loadChart()가 새로 시작됐으면 이 재확인은 건너뜀)
  [300, 800, 1500].forEach(delay => {
    setTimeout(() => {
      if (myToken !== _loadToken) return;
      applyFit();
    }, delay);
  });
}

function isLTF() {
  return ['1m','5m','15m','1h'].includes(currentTF);
}

// ─── CLEAR ────────────────────────────────────────────────
function clearMain() {
  [...fvgBullSeries,...fvgBearSeries,...obBullSeries,...obBearSeries].forEach(s => {
    if (s&&s.top) { try{chart.removeSeries(s.top);}catch(e){} }
    if (s&&s.bot) { try{chart.removeSeries(s.bot);}catch(e){} }
  });
  fvgBullSeries=[]; fvgBearSeries=[]; obBullSeries=[]; obBearSeries=[];
  liqLines.forEach(l => { try{candleSeries.removePriceLine(l);}catch(e){} });
  liqLines=[];
}

function clearHTF() {
  htf4HLines.forEach(l => { try{candleSeries.removePriceLine(l);}catch(e){} });
  htf4HLines=[];
}

function clearAll() {
  clearMain();
  clearHTF();
}

// ─── PRICE LINE HELPER ────────────────────────────────────
function addPriceLine(price, color, width, style, label, labelVis=true) {
  return candleSeries.createPriceLine({
    price, color,
    lineWidth: width,
    lineStyle: style,
    axisLabelVisible: labelVis,
    title: label,
  });
}

// ─── BOX HELPER ───────────────────────────────────────────
function addBox(t1, t2, low, high, fillColor, lineColor, lw=2) {
  const topLine = chart.addLineSeries({
    color: lineColor, lineWidth: lw,
    lineStyle: LightweightCharts.LineStyle.Solid,
    lastValueVisible: false, priceLineVisible: false, crosshairMarkerVisible: false,
    autoscaleInfoProvider: () => null,
  });
  topLine.setData([{time:t1,value:high},{time:t2,value:high}]);

  const botLine = chart.addLineSeries({
    color: lineColor, lineWidth: lw,
    lineStyle: LightweightCharts.LineStyle.Solid,
    lastValueVisible: false, priceLineVisible: false, crosshairMarkerVisible: false,
    autoscaleInfoProvider: () => null,
  });
  botLine.setData([{time:t1,value:low},{time:t2,value:low}]);

  return { top: topLine, bot: botLine };
}

// ─── ICT ANALYSIS ─────────────────────────────────────────
function analyzeAndDraw(data) {
  clearMain();
  if (data.length < 5) return;

  const lastTime = data[data.length-1].time + 86400*7; // 7일 연장
  const D = LightweightCharts.LineStyle.Dashed;
  const S = LightweightCharts.LineStyle.Solid;

  // ── FVG ───────────────────────────────────────────────
  const fvgBull=[], fvgBear=[];
  for (let i=1; i<data.length-1; i++) {
    const p=data[i-1], n=data[i+1];
    if (n.low > p.high) fvgBull.push({time:data[i].time, low:p.high, high:n.low});
    if (n.high < p.low) fvgBear.push({time:data[i].time, low:n.high, high:p.low});
  }

  if (layers.fvgBull) {
    fvgBull.slice(-3).forEach(f => {
      const s = addBox(f.time, lastTime, f.low, f.high, 'rgba(0,180,255,0.15)', '#00b4ff', 1);
      fvgBullSeries.push(s);
    });
  }
  if (layers.fvgBear) {
    fvgBear.slice(-3).forEach(f => {
      const s = addBox(f.time, lastTime, f.low, f.high, 'rgba(255,200,0,0.15)', '#ffc800', 1);
      fvgBearSeries.push(s);
    });
  }

  // ── OB ────────────────────────────────────────────────
  const obBull=[], obBear=[];
  for (let i=1; i<data.length-1; i++) {
    const c=data[i], n=data[i+1];
    if (c.close<c.open && n.close>n.open && n.close>c.high) obBull.push(c);
    if (c.close>c.open && n.close<n.open && n.close<c.low)  obBear.push(c);
  }

  // 현재가 아래 강세 OB
  const curPrice = data[data.length-1].close;
  const belowBull = obBull.filter(o=>o.high<curPrice).slice(-2);
  const aboveBear = obBear.filter(o=>o.low>curPrice).slice(-2);

  if (layers.obBull) {
    belowBull.forEach(o => {
      const s = addBox(o.time, lastTime, o.low, o.high, 'rgba(0,229,160,0.15)', '#00e5a0', 2);
      obBullSeries.push(s);
    });
  }
  if (layers.obBear) {
    aboveBear.forEach(o => {
      const s = addBox(o.time, lastTime, o.low, o.high, 'rgba(255,68,102,0.15)', '#ff4466', 2);
      obBearSeries.push(s);
    });
  }

  // ── 유동성 ────────────────────────────────────────────
  const lows=[...data].sort((a,b)=>a.low-b.low).slice(0,3);
  const highs=[...data].sort((a,b)=>b.high-a.high).slice(0,3);

  if (layers.liq) {
    highs.forEach(c => {
      const l = addPriceLine(c.high,'rgba(255,68,102,0.5)',1,LightweightCharts.LineStyle.Dashed,'↑ HH');
      liqLines.push(l);
    });
    lows.forEach(c => {
      const l = addPriceLine(c.low,'rgba(0,229,160,0.5)',1,LightweightCharts.LineStyle.Dashed,'↓ LL');
      liqLines.push(l);
    });
  }

  // ── 구조/바이어스 분석 ─────────────────────────────────
  const recent = data.slice(-30);
  let hh=0, ll=Infinity, hhIdx=0, llIdx=0;
  recent.forEach((c,i) => {
    if (c.high>hh) { hh=c.high; hhIdx=i; }
    if (c.low<ll)  { ll=c.low;  llIdx=i; }
  });
  const bias = llIdx > hhIdx ? '상승' : hhIdx > llIdx ? '하락' : '중립';

  // AMD / 킬존
  const nowUTC = new Date().getUTCHours();
  const nowKST = (nowUTC + 9) % 24;
  let amd = '-';
  if (nowKST>=9&&nowKST<12) amd='축적';
  else if (nowKST>=16&&nowKST<19) amd='조작';
  else if (nowKST>=22||nowKST<1) amd='배분';

  // 킬존 배지
  const kzBadge = document.getElementById('kzBadge');
  if (kzBadge) {
    kzBadge.className = 'kz-badge';
    kzBadge.textContent = '';
    if (nowKST>=16&&nowKST<19) {
      kzBadge.classList.add('show','london');
      kzBadge.textContent='🇬🇧 런던 킬존';
    } else if (nowKST>=22||nowKST<1) {
      kzBadge.classList.add('show','ny');
      kzBadge.textContent='🇺🇸 뉴욕 킬존';
    }
  }

  // AMD 배지
  const amdBadge = document.getElementById('amdBadge');
  if (amdBadge) {
    amdBadge.className = 'amd-badge';
    if (amd!=='-') {
      amdBadge.classList.add('show');
      amdBadge.textContent = amd;
    }
  }

  // 신호
  const sig = document.getElementById('signalBadge');
  sig.className = 'signal-badge';
  if (belowBull.length && bias==='상승') {
    sig.classList.add('show','buy'); sig.textContent='● 매수';
  } else if (aboveBear.length && bias==='하락') {
    sig.classList.add('show','sell'); sig.textContent='● 매도';
  } else {
    sig.classList.add('show','wait'); sig.textContent='⏳ 대기';
  }

  // 하단 스탯
  document.getElementById('statFVG').textContent = fvgBull.length+fvgBear.length;
  document.getElementById('statOB').textContent = obBull.length+obBear.length;
  document.getElementById('statLiq').textContent = lows.length+highs.length;

  const mssEl = document.getElementById('statMSS');
  const mssText = bias==='상승'?'상승':bias==='하락'?'하락':'중립';
  mssEl.textContent = mssText;
  mssEl.className = 'stat-val ' + (bias==='상승'?'bull':bias==='하락'?'bear':'neutral');

  const amdEl = document.getElementById('statAMD');
  amdEl.textContent = amd;
  amdEl.className = 'stat-val ' + (amd==='배분'?'bull':amd==='조작'?'bear':'neutral');

  const biasEl = document.getElementById('statBias');
  const biasText = bias==='상승'?'매수':bias==='하락'?'매도':'중립';
  biasEl.textContent = biasText;
  biasEl.className = 'stat-val '+(bias==='상승'?'bull':bias==='하락'?'bear':'neutral');
}

// ─── 4H OVERLAY ───────────────────────────────────────────
async function draw4H() {
  clearHTF();
  try {
    const htfData = await fetchCandles(currentSymbol, '4h');
    if (!htfData || htfData.length < 5) return;

    const recent = htfData.slice(-20);
    const D = LightweightCharts.LineStyle.Dashed;

    for (let i=1; i<recent.length-1; i++) {
      const p=recent[i-1], c=recent[i], n=recent[i+1];

      // 강세 OB
      if (c.close<c.open && n.close>n.open && n.close>c.high) {
        const lH = addPriceLine(c.high,'#00e5a0',2,D,'4H 강세OB');
        const lL = addPriceLine(c.low,'#00e5a0',2,D,'',false);
        htf4HLines.push(lH, lL);
      }
      // 약세 OB
      if (c.close>c.open && n.close<n.open && n.close<c.low) {
        const lH = addPriceLine(c.high,'#ffc800',2,D,'4H 약세OB');
        const lL = addPriceLine(c.low,'#ffc800',2,D,'',false);
        htf4HLines.push(lH, lL);
      }
      // 강세 FVG
      if (n.low > p.high) {
        const mid = (n.low+p.high)/2;
        const l = addPriceLine(mid,'#00b4ff',2,D,'4H FVG');
        htf4HLines.push(l);
      }
      // 약세 FVG
      if (n.high < p.low) {
        const mid = (n.high+p.low)/2;
        const l = addPriceLine(mid,'#ffc800',2,D,'4H FVG');
        htf4HLines.push(l);
      }
    }
  } catch(e) { console.warn('4H error:', e); }
}

// ─── WEBSOCKET ────────────────────────────────────────────
function connectWS() {
  // 이 소켓이 어떤 심볼/TF용인지 고정해두고, 나중에 currentSymbol/currentTF가
  // 바뀌어도 이 소켓의 콜백이 잘못된 재연결이나 낡은 데이터 반영을 하지 않게 함
  const mySymbol = currentSymbol;
  const myTF = currentTF;

  if (wsReconnectTimer) { clearTimeout(wsReconnectTimer); wsReconnectTimer = null; }
  if (ws) { try { ws.onerror = null; ws.onclose = null; ws.onmessage = null; ws.close(); } catch(e){} ws = null; }
  _lastCandleTime = candles.length ? candles[candles.length-1].time : 0;
  const sym = mySymbol.toLowerCase();

  // kline(캔들 확정용) + aggTrade(실시간 체결가 갱신용)를 하나의 소켓으로 합쳐서 구독.
  // kline만 쓰면 바이낸스 서버가 초당 1번으로 묶어서 보내는 제한 때문에 화면이
  // "뚝뚝 튀는" 느낌이 남 — aggTrade는 체결이 일어날 때마다 오므로 그 사이를 채워준다.
  const streams = `${sym}@kline_${myTF}/${sym}@aggTrade`;
  const socket = new WebSocket(`wss://stream.binance.com:9443/stream?streams=${streams}`);
  ws = socket;
  socket.onopen = () => console.log('WS connected:', sym, myTF);
  // 재연결은 onclose 한 곳에서만, 딱 한 번만 예약한다.
  // (onerror에서도 재연결을 걸면 브라우저가 error→close를 연달아 발생시켜
  //  같은 실패에 재연결이 2개씩 겹쳐 걸리고, 그게 반복되면서 소켓이 계속
  //  늘어나 캔들이 여러 스트림에서 따로 갱신되는 "차트 두 개" 버그가 났었음)
  socket.onerror = () => { if (ws === socket) ws = null; };
  socket.onclose = () => {
    if (ws !== socket) return; // 이미 다른 소켓으로 교체된 뒤라면 무시
    ws = null;
    // 그 사이 심볼/TF가 바뀌었으면 이 소켓 재연결은 의미 없음 (새 소켓이 이미 연결됨)
    if (mySymbol !== currentSymbol || myTF !== currentTF) return;
    wsReconnectTimer = setTimeout(() => {
      wsReconnectTimer = null;
      if (!ws && mySymbol === currentSymbol && myTF === currentTF) connectWS();
    }, 3000);
  };
  socket.onmessage = (e) => {
    if (ws !== socket) return; // 이미 교체된 낡은 소켓이면 무시
    const msg = JSON.parse(e.data);
    if (!msg.stream) return;
    if (msg.stream.endsWith('@kline_' + myTF)) {
      const d = msg.data.k;
      handleCandle({
        time: d.t/1000,
        open: parseFloat(d.o),
        high: parseFloat(d.h),
        low:  parseFloat(d.l),
        close:parseFloat(d.c),
      }, d.x);
    } else if (msg.stream.endsWith('@aggTrade')) {
      const price = parseFloat(msg.data.p);
      if (!price || !candles.length) return;
      // 아직 진행 중인(닫히지 않은) 마지막 캔들의 종가만 실시간으로 살짝 갱신.
      // 캔들 확정(닫힘)이나 배열 추가는 여전히 kline 메시지 쪽에서만 처리.
      const last = candles[candles.length - 1];
      const updated = {
        time: last.time,
        open: last.open,
        high: Math.max(last.high, price),
        low: Math.min(last.low, price),
        close: price,
      };
      // 배열에도 즉시 반영해야 다음 aggTrade 틱이 "이미 찍힌 고저가"를 기준으로
      // 계산함. 안 그러면 매번 낡은 high/low로 되돌아가 계산되면서 방금 찍힌
      // wick(위/아래 꼬리)이 다음 틱에 사라지는 버그가 생김.
      candles[candles.length - 1] = updated;
      _codeUpdating = true;
      candleSeries.update(updated);
      _codeUpdating = false;
      updatePrice(updated);
    }
  };
}

let _lastCandleTime = 0;
function handleCandle(candle, isClosed) {
  // 과거 시간 캔들이거나 비정상 데이터면 무시
  if (candle.time < _lastCandleTime) return;
  if (!candle.open || !candle.high || !candle.low || !candle.close) return;
  if (candle.high < candle.low) return;
  _lastCandleTime = candle.time;
  _codeUpdating = true;
  candleSeries.update(candle);
  _codeUpdating = false;
  updatePrice(candle);
  if (isClosed) {
    candles.push(candle);
    if (candles.length > 300) candles.shift();
    saveAndRestore(() => analyzeAndDraw(candles));
  } else if (candles.length && candles[candles.length - 1].time === candle.time) {
    // 아직 진행 중인 캔들이면, 배열의 마지막 캔들도 최신 고저가로 맞춰둔다.
    // (aggTrade 틱이 이 값을 기준으로 다시 계산하므로 여기서도 동기화 필요)
    candles[candles.length - 1] = candle;
  }
}

// ─── PRICE DISPLAY ────────────────────────────────────────
function updatePrice(candle) {
  const el = document.getElementById('priceMain');
  const chEl = document.getElementById('priceChange');
  const price = candle.close;
  el.textContent = price > 1000
    ? price.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})
    : price.toFixed(4);
  if (openPrice) {
    const chg = ((price-openPrice)/openPrice*100).toFixed(2);
    chEl.textContent = (chg>=0?'+':'')+chg+'%';
    chEl.style.color = chg>=0?'#00e5a0':'#ff4466';
  }
}

// ─── CONTROLS ─────────────────────────────────────────────
function changeSymbol(sym, btn) {
  document.querySelectorAll('.sym-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentSymbol = sym;
  loadChart();
}

function changeTF(tf, btn) {
  if (tf === currentTF) return;
  document.querySelectorAll('.tf-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentTF = tf;
  loadChart();
}

function toggleHTF() {
  htfOn = !htfOn;
  const el = document.getElementById('leg-htf');
  if (el) el.classList.toggle('off', !htfOn);
  if (htfOn && isLTF()) saveAndRestore(() => draw4H());
  else clearHTF();
}

function toggleLayer(name) {
  layers[name] = !layers[name];
  const legMap = {
    fvgBull:'leg-fvg-bull', fvgBear:'leg-fvg-bear',
    obBull:'leg-ob-bull', obBear:'leg-ob-bear',
    liq:'leg-liq',
  };
  const el = document.getElementById(legMap[name]);
  if (el) el.classList.toggle('off', !layers[name]);
  saveAndRestore(() => analyzeAndDraw(candles));
}

// ─── INIT ─────────────────────────────────────────────────
// initChart()가 실행되는 순간 브라우저 레이아웃이 아직 완전히 자리잡지
// 않았을 수 있어서(플렉스 박스 크기 계산이 실제로 안정되기 전), 그 상태에서
// 차트 크기를 측정하면 좁은 값으로 잘못 굳어버릴 수 있음. 두 번의
// requestAnimationFrame으로 최소 한 번의 레이아웃+페인트 사이클이 끝난
// 뒤에 시작하도록 미뤄서, 측정 시점의 크기가 항상 실제 최종 크기이도록 함.
requestAnimationFrame(() => {
  requestAnimationFrame(() => {
    initChart();
    loadChart();
  });
});

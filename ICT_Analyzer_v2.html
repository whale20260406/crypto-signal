<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICT Analyzer</title>
<script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&display=swap');

  :root {
    --bg: #0a0a0f;
    --panel: #111118;
    --border: #1e1e2e;
    --accent: #00d4ff;
    --bull: #00e5a0;
    --bear: #ff4466;
    --text: #c8c8e0;
    --muted: #555570;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    flex-wrap: nowrap;
    overflow: hidden;
  }

  .logo {
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 2px;
    white-space: nowrap;
  }

  .symbol-btns {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .symbol-btns::-webkit-scrollbar { display: none; }

  .sym-btn {
    padding: 6px 12px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    font-family: 'Space Mono', monospace;
    transition: all 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .sym-btn:hover, .sym-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0,212,255,0.08);
  }

  .tf-btns {
    display: flex;
    gap: 4px;
    margin-left: auto;
    flex-shrink: 0;
  }
  .tf-btn {
    padding: 4px 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
    font-family: 'Space Mono', monospace;
    transition: all 0.15s;
  }
  .tf-btn:hover, .tf-btn.active {
    border-color: var(--bull);
    color: var(--bull);
    background: rgba(0,229,160,0.08);
  }

  .legend-bar {
    display: flex;
    gap: 12px;
    padding: 6px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    font-size: 11px;
    flex-wrap: wrap;
    align-items: center;
  }
  .leg-item {
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    opacity: 1;
    transition: opacity 0.2s;
    user-select: none;
  }
  .leg-item.off { opacity: 0.3; }
  .leg-box {
    width: 14px;
    height: 10px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .leg-label { color: var(--muted); font-size: 11px; white-space: nowrap; }

  #chart-container {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  #chart { width: 100%; height: 100%; }

  #clockOverlay {
    position: absolute;
    right: 8px;
    bottom: 4px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    background: rgba(10,10,15,0.6);
    padding: 2px 8px;
    border-radius: 4px;
    pointer-events: none;
    z-index: 5;
  }

  .bottom-panel {
    display: flex;
    background: var(--panel);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    height: 56px;
  }
  .stat-box {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-right: 1px solid var(--border);
    padding: 4px;
  }
  .stat-box:last-child { border-right: none; }
  .stat-label {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    font-family: 'Space Mono', monospace;
  }
  .stat-val {
    font-size: 13px;
    font-weight: 700;
    font-family: 'Space Mono', monospace;
    margin-top: 2px;
  }
  .bull { color: var(--bull); }
  .bear { color: var(--bear); }
  .neutral { color: var(--accent); }

  .price-overlay {
    position: absolute;
    top: 10px;
    left: 10px;
    font-family: 'Space Mono', monospace;
    pointer-events: none;
    z-index: 10;
  }
  .price-main {
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 20px rgba(0,212,255,0.3);
  }
  .price-change { font-size: 12px; margin-top: 2px; }

  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--bull);
    display: inline-block;
    margin-right: 4px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .signal-badge {
    display: none;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 6px;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    animation: badgePop 0.4s ease;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .signal-badge.show { display: flex; }
  .signal-badge.buy { background: rgba(0,229,160,0.15); border: 1px solid var(--bull); color: var(--bull); }
  .signal-badge.sell { background: rgba(255,68,102,0.15); border: 1px solid var(--bear); color: var(--bear); }
  .signal-badge.wait { background: rgba(0,212,255,0.08); border: 1px solid var(--accent); color: var(--accent); }

  .kz-badge {
    display: none;
    align-items: center;
    padding: 4px 10px;
    border-radius: 4px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .kz-badge.show { display: flex; }
  .kz-badge.london { background: rgba(255,120,0,0.15); border: 1px solid #ff7800; color: #ff7800; }
  .kz-badge.ny { background: rgba(255,200,0,0.15); border: 1px solid #ffc800; color: #ffc800; }

  .amd-badge {
    display: none;
    align-items: center;
    padding: 4px 10px;
    border-radius: 4px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    background: rgba(0,229,160,0.08);
    border: 1px solid rgba(0,229,160,0.4);
    color: var(--bull);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .amd-badge.show { display: flex; }

  .sb-badge {
    display: none;
    align-items: center;
    padding: 4px 10px;
    border-radius: 4px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
    flex-shrink: 0;
    background: rgba(180,80,255,0.15);
    border: 1px solid #b450ff;
    color: #b450ff;
  }
  .sb-badge.show { display: flex; }

  .judas-badge {
    display: none;
    align-items: center;
    padding: 4px 10px;
    border-radius: 4px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
    flex-shrink: 0;
    animation: badgePop 0.4s ease;
  }
  .judas-badge.show { display: flex; }
  .judas-badge.bull { background: rgba(0,229,160,0.15); border: 1px solid #00e5a0; color: #00e5a0; }
  .judas-badge.bear { background: rgba(255,68,102,0.15); border: 1px solid #ff4466; color: #ff4466; }

  @keyframes badgePop {
    0% { transform: scale(0.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>

  <div class="leg-item" id="leg-ob-bear" onclick="toggleLayer('obBear')">

<script>
// ─── STATE ────────────────────────────────────────────────
let chart, candleSeries;
let currentSymbol = 'BTCUSDT';
let currentTF = '1h';
let ws = null;
let wsReconnectTimer = null;
let candles = [];
let htfOn = false;
let openPrice = null;
let userScrollPos = null;  // 사용자 스크롤 위치 (픽셀)
let isUserScrolled = false; // 사용자가 스크롤 했는지

let layers = { fvgBull: true, fvgBear: true, obBull: true, obBear: true, liq: true, ote: true, dw: true, judas: true, structure: true };

// overlay storage
let fvgBullSeries=[], fvgBearSeries=[], obBullSeries=[], obBearSeries=[], liqLines=[];
// 4H overlay (priceLine 기반)
let htf4HLines = [];
// OTE(Premium/Discount) 존
let oteBoxes=[], oteLines=[];
// 전일/주간 레벨 (PDH/PDL, 데일리/위클리 오픈)
let dwLines=[];
// 현재 세션 상태 (킬존/AMD/실버불릿) - updateSessionBadges()에서 갱신, judas 판정에서 재사용
let currentZones = {};

// ─── CHART INIT ───────────────────────────────────────────
// lightweight-charts v3에는 timezone 옵션 자체가 없어서 (timeScale.timezone은 무시되는 필드),
// 캔들 시간(UTC unix)을 직접 KST(+9시간)로 변환해서 축/크로스헤어에 표시해준다.
function kstParts(time) {
  const d = new Date((time + 9*3600) * 1000);
  return { y: d.getUTCFullYear(), mo: d.getUTCMonth()+1, day: d.getUTCDate(), h: d.getUTCHours(), mi: d.getUTCMinutes() };
}
// 라이브러리가 넘겨주는 tickMarkType(연/월/일/시각 중 지금 눈금이 어느 단위로 바뀌는지)을 그대로 써서
// 포맷을 결정한다. 이전엔 "KST 00:00이면 날짜로 표시"라는 방식이었는데, 일봉/주봉은 캔들 시작이
// UTC 00:00 = KST 09:00이라 절대 00:00이 안 나와서 날짜가 아예 안 뜨고 계속 09:00만 찍히던 버그가 있었음.
function kstAxisFormat(time, tickMarkType) {
  const p = kstParts(time);
  const TMT = LightweightCharts.TickMarkType;
  if (tickMarkType === TMT.Year) return `${p.y}`;
  if (tickMarkType === TMT.Month) return `${p.y}.${p.mo}`;
  if (tickMarkType === TMT.DayOfMonth) return `${p.mo}/${p.day}`;
  return `${String(p.h).padStart(2,'0')}:${String(p.mi).padStart(2,'0')}`;
}
function kstCrosshairFormat(time) {
  const p = kstParts(time);
  return `${p.mo}월 ${p.day}일 ${String(p.h).padStart(2,'0')}:${String(p.mi).padStart(2,'0')} (KST)`;
}

function initChart() {
  chart = LightweightCharts.createChart(document.getElementById('chart'), {
    layout: { background: { color: '#0a0a0f' }, textColor: '#c8c8e0' },
    grid: { vertLines: { color: '#1a1a2a' }, horzLines: { color: '#1a1a2a' } },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { borderColor: '#1e1e2e' },
    localization: { timeFormatter: kstCrosshairFormat },
    timeScale: { borderColor: '#1e1e2e', rightOffset: 0, barSpacing: 6, lockVisibleTimeRangeOnResize: true, shiftVisibleRangeOnNewBar: false, fixLeftEdge: false, fixRightEdge: false, tickMarkFormatter: kstAxisFormat },
    handleScroll: true,
    handleScale: true,
  });

  candleSeries = chart.addCandlestickSeries({
    upColor: '#00e5a0',
    downColor: '#ff4466',
    borderUpColor: '#00e5a0',
    borderDownColor: '#ff4466',
    wickUpColor: '#00e5a0',
    wickDownColor: '#ff4466',
  });

  window.addEventListener('resize', () => chart.resize(
    document.getElementById('chart').clientWidth,
    document.getElementById('chart').clientHeight
  ));

  // 사용자가 차트 건드리면 위치 저장
  chart.timeScale().subscribeVisibleLogicalRangeChange(() => {
    if (!_codeUpdating) {
      userScrollPos = chart.timeScale().getVisibleLogicalRange();
      isUserScrolled = true;
    }
  });
}

let _codeUpdating = false;

// ─── SCROLL RESTORE ───────────────────────────────────────
function saveAndRestore(fn) {
  _codeUpdating = true;
  const savedPos = userScrollPos; // fn() 실행 전 위치를 미리 붙잡아둔다
  fn();
  // fn() 안에서 박스/시리즈를 다시 그리면 차트가 자동으로 오른쪽 끝으로 밀리는 경우가 있어서,
  // 사용자가 스크롤해서 보고 있던 위치가 있으면 그 자리로 강제로 되돌려준다.
  // requestAnimationFrame으로 한 프레임 늦춰서 라이브러리 내부 자동 정렬보다 나중에 실행되게 함.
  if (isUserScrolled && savedPos) {
    requestAnimationFrame(() => {
      chart.timeScale().setVisibleLogicalRange(savedPos);
    });
  }
  setTimeout(() => { _codeUpdating = false; }, 60);
}

// ─── DATA ─────────────────────────────────────────────────
async function fetchCandles(symbol, tf) {
  const tfMap = { '1m':'1m','5m':'5m','15m':'15m','1h':'1h','4h':'4h','1d':'1d' };
  const interval = tfMap[tf] || '1h';
  const limit = 200;
  // 선물(fapi) 엔드포인트가 브라우저에서 CORS로 막혀 데이터를 못 받아오는
  // 문제가 있어서, 확실히 되는 스팟으로 되돌림. BTC 기준 스팟-선물 가격차는
  // 보통 아주 작아서(±0.1% 이내) 분석 용도로는 사실상 차이가 없음.
  const binanceUrl = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=${limit}`;
  const proxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(binanceUrl)}`;

  try {
    let res = await fetch(binanceUrl);
    if (!res.ok) throw new Error();
    const data = await res.json();
    return data.map(k => ({
      time: k[0]/1000,
      open: parseFloat(k[1]),
      high: parseFloat(k[2]),
      low:  parseFloat(k[3]),
      close:parseFloat(k[4]),
      volume:parseFloat(k[5]),
    }));
  } catch {
    try {
      let res = await fetch(proxy);
      const data = await res.json();
      return data.map(k => ({
        time: k[0]/1000,
        open: parseFloat(k[1]),
        high: parseFloat(k[2]),
        low:  parseFloat(k[3]),
        close:parseFloat(k[4]),
        volume:parseFloat(k[5]),
      }));
    } catch { return []; }
  }
}

// ─── LOAD CHART ───────────────────────────────────────────
// 심볼/TF를 빠르게 연속으로 바꾸면 fetchCandles()가 여러 개 동시에 날아가고,
// 먼저 시작했지만 나중에 응답이 오는 요청이 최신 차트를 오래된 데이터로 덮어써서
// "가짜차트"가 잠깐 보이고, 그 뒤 실시간 캔들이 시간 역행 업데이트를 시도하면서
// "Cannot update oldest data" 에러가 났었음. 요청마다 토큰을 발급해서
// 가장 마지막에 시작한 요청의 결과만 반영하도록 막는다.
let _loadToken = 0;
async function loadChart() {
  const myToken = ++_loadToken;
  clearAll();
  const fetched = await fetchCandles(currentSymbol, currentTF);
  // 기다리는 동안 더 최신 loadChart()가 시작됐다면 이 결과는 낡은 것이므로 버림
  if (myToken !== _loadToken) return;
  candles = fetched;
  if (!candles.length) return;
  openPrice = candles[0].open;
  isUserScrolled = false;
  candleSeries.setData(candles);
  updatePrice(candles[candles.length-1]);
  analyzeAndDraw(candles);
  connectWS();
  drawDailyWeekly(myToken);
}

function isLTF() {
  return ['1m','5m','15m','1h'].includes(currentTF);
}

    if (s&&s.bot) { try{chart.removeSeries(s.bot);}catch(e){} }

  [...liqLines,...oteLines].forEach(l => { try{candleSeries.removePriceLine(l);}catch(e){} });
  liqLines=[]; oteLines=[];
}

// ─── BOX HELPER ───────────────────────────────────────────
function addBox(t1, t2, low, high, fillColor, lineColor, lw=2) {
  const topLine = chart.addLineSeries({
    color: lineColor, lineWidth: lw,
    lineStyle: LightweightCharts.LineStyle.Solid,
    lastValueVisible: false, priceLineVisible: false, crosshairMarkerVisible: false,
    autoscaleInfoProvider: () => null,
  });
  topLine.setData([{time:t1,value:high},{time:t2,value:high}]);

  const botLine = chart.addLineSeries({
    color: lineColor, lineWidth: lw,

    autoscaleInfoProvider: () => null,
  });
  botLine.setData([{time:t1,value:low},{time:t2,value:low}]);

  return { top: topLine, bot: botLine };
}

// ─── SWING HIGH/LOW (구조 분석용) ───────────────────────────
// 캔들 하나가 양옆 k개 캔들보다 고점/저점이 더 높거나/낮으면 "스윙 포인트"로 인정.
// 이렇게 뽑은 스윙 포인트들의 순서를 비교해야 진짜 HH/HL(상승) vs LH/LL(하락) 구조를
// 알 수 있음 — 예전엔 그냥 "30개 캔들 중 최고/최저가 어느 게 더 최근이냐"만 봐서,
// 정상적인 상승 추세(최근일수록 고점이 갱신됨)를 오히려 "하락"으로 잘못 판정하던 버그가 있었음.
function findSwings(data, k=2) {
  const highs = [], lows = [];
  for (let i=k; i<data.length-k; i++) {
    let isHigh = true, isLow = true;
    for (let j=1; j<=k; j++) {
      if (data[i].high <= data[i-j].high || data[i].high <= data[i+j].high) isHigh = false;
      if (data[i].low  >= data[i-j].low  || data[i].low  >= data[i+j].low ) isLow = false;
    }
    if (isHigh) highs.push({ idx: i, price: data[i].high });
    if (isLow)  lows.push({ idx: i, price: data[i].low });
  }
  return { highs, lows };
}

// ─── BOS / CHoCH / IDM 마커 ─────────────────────────────
// 스윙 고점·저점을 시간순으로 합쳐서, 직전 같은 종류(고점 vs 고점, 저점 vs 저점)의
// 스윙과 비교한다. 그 방향으로 이미 추세가 진행 중이면 BOS(지속), 처음 반대로
// 깨지는 순간이면 CHoCH(전환)로 표시. CHoCH 직전에 있던 반대 타입의 스윙(진짜
// 전환을 만들기 전 낚였던 작은 자리)은 IDM(인듀스먼트)로 별도 표시한다.
function computeStructureMarkers(data) {
  if (!layers.structure || data.length < 20) { candleSeries.setMarkers([]); return; }
  const window = data.slice(-150);
  const offset = data.length - window.length;
  const { highs, lows } = findSwings(window, 2);
  const points = [
    ...highs.map(h => ({ idx: h.idx, price: h.price, type: 'H' })),
    ...lows.map(l => ({ idx: l.idx, price: l.price, type: 'L' })),
  ].sort((a, b) => a.idx - b.idx);

  const markers = [];
  let lastHigh = null, lastLow = null, trend = null;
  const chochPts = []; // 이 지점들 직전에서 IDM을 찾는다

  points.forEach((p, pi) => {
    const idx = p.idx + offset;
    const t = data[idx].time;
    if (p.type === 'H') {
      if (lastHigh !== null && p.price > lastHigh) {
        const isNewTrend = trend !== 'up';
        trend = 'up';
        markers.push({ time: t, position: 'aboveBar', color: isNewTrend ? '#ffc800' : '#00e5a0', shape: 'arrowUp', text: isNewTrend ? 'CHoCH' : 'BOS' });
        if (isNewTrend) chochPts.push(pi);
      }
      lastHigh = p.price;
    } else {
      if (lastLow !== null && p.price < lastLow) {
        const isNewTrend = trend !== 'down';
        trend = 'down';
        markers.push({ time: t, position: 'belowBar', color: isNewTrend ? '#ffc800' : '#ff4466', shape: 'arrowDown', text: isNewTrend ? 'CHoCH' : 'BOS' });
        if (isNewTrend) chochPts.push(pi);
      }
      lastLow = p.price;
    }
  });

  // IDM: 각 CHoCH 바로 앞에 있던 반대 타입 스윙 = 진짜 전환 전 낚였던 자리
  chochPts.forEach(pi => {
    const wantType = points[pi].type === 'H' ? 'L' : 'H';
    for (let j = pi - 1; j >= 0; j--) {
      if (points[j].type === wantType) {
        const idx = points[j].idx + offset;
        markers.push({
          time: data[idx].time,
          position: wantType === 'L' ? 'belowBar' : 'aboveBar',
          color: '#8888ff', shape: 'circle', text: 'IDM',
        });
        break;
      }
    }
  });

  markers.sort((a, b) => a.time - b.time);
  candleSeries.setMarkers(markers);
}


// key가 'high'면 비슷한 높이의 고점들을(매수측 유동성 BSL), 'low'면 비슷한 저점들을
// (매도측 유동성 SSL) tolerancePct(%) 오차 내에서 묶어 클러스터로 반환한다.
function findEqualLevels(data, key, tolerancePct=0.08) {
  const used = new Array(data.length).fill(false);
  const clusters = [];
  for (let i=0; i<data.length; i++) {
    if (used[i]) continue;
    const base = data[i][key];
    let sum = base, count = 1, lastIdx = i;
    used[i] = true;
    for (let j=i+1; j<data.length; j++) {
      if (used[j]) continue;
      if (Math.abs(data[j][key]-base)/base*100 <= tolerancePct) {
        sum += data[j][key]; count++; used[j] = true; lastIdx = j;
      }
    }
    if (count >= 2) clusters.push({ price: sum/count, count, lastIdx });
  }
  // 겹치는 수가 많을수록, 같은 수라면 더 최근에 닿은 클러스터일수록 뒤로(우선순위 높게)
  return clusters.sort((a,b)=> (a.count-b.count) || (a.lastIdx-b.lastIdx));
}

// ─── ICT ANALYSIS ─────────────────────────────────────────
function analyzeAndDraw(data) {
  clearMain();
  if (data.length < 5) return;

  // 박스(FVG/OB/OTE)를 얼마나 미래로 연장할지: 예전엔 무조건 "7일"이었는데,
  // 1분봉 기준 7일 = 캔들 1만 개 분량이라 실제 캔들이 화면 왼쪽 구석에 몰리고
  // 나머지 전부 빈 공간이 되는 심각한 버그였음. 타임프레임에 비례해서 8개 캔들 정도만 연장.
  // 박스(FVG/OB/OTE)가 미래로 조금이라도 연장되면, 그 끝점이 "마지막 캔들보다 오른쪽"의
  // 새로운 시간대가 되어버려서, 차트가 오른쪽 끝에 붙어있을 때 그 새 지점을 따라가며
  // 계속 조금씩 밀리는 문제가 있었음. 아예 연장하지 않고 마지막 캔들 시각에서 정확히
  // 끝나도록 해서(=기존 데이터의 가장 오른쪽 지점과 동일), 시간 범위 자체가 넓어질 일이 없게 함.
  const lastTime = data[data.length-1].time;
  const D = LightweightCharts.LineStyle.Dashed;
  const S = LightweightCharts.LineStyle.Solid;

  // ── FVG ───────────────────────────────────────────────
  const fvgBull=[], fvgBear=[];
  for (let i=1; i<data.length-1; i++) {
    const p=data[i-1], n=data[i+1];
    if (n.low > p.high) fvgBull.push({time:data[i].time, low:p.high, high:n.low});
    if (n.high < p.low) fvgBear.push({time:data[i].time, low:n.high, high:p.low});
  }

  if (layers.fvgBull) {
    fvgBull.slice(-3).forEach(f => {
      const s = addBox(f.time, lastTime, f.low, f.high, 'rgba(0,180,255,0.15)', '#00b4ff', 1);
      fvgBullSeries.push(s);
    });
  }
  if (layers.fvgBear) {
    fvgBear.slice(-3).forEach(f => {
      const s = addBox(f.time, lastTime, f.low, f.high, 'rgba(255,200,0,0.15)', '#ffc800', 1);
      fvgBearSeries.push(s);
    });
  }

  // ── OB ────────────────────────────────────────────────
  const obBull=[], obBear=[];
  for (let i=1; i<data.length-1; i++) {
    const c=data[i], n=data[i+1];
    if (c.close<c.open && n.close>n.open && n.close>c.high) obBull.push(c);
    if (c.close>c.open && n.close<n.open && n.close<c.low)  obBear.push(c);
  }

  // 현재가 아래 강세 OB
  const curPrice = data[data.length-1].close;
  const belowBull = obBull.filter(o=>o.high<curPrice).slice(-2);
  const aboveBear = obBear.filter(o=>o.low>curPrice).slice(-2);

  if (layers.obBull) {
    belowBull.forEach(o => {
      const s = addBox(o.time, lastTime, o.low, o.high, 'rgba(0,229,160,0.15)', '#00e5a0', 2);
      obBullSeries.push(s);
    });
  }
  if (layers.obBear) {
    aboveBear.forEach(o => {
      const s = addBox(o.time, lastTime, o.low, o.high, 'rgba(255,68,102,0.15)', '#ff4466', 2);
      obBearSeries.push(s);
    });
  }

  // ── BSL / SSL (매수측/매도측 유동성) ──────────────────────
  // 비슷한 높이의 고점/저점이 2개 이상 모이면 그 위/아래에 스탑로스가 쌓인
  // "진짜" 유동성 풀로 본다 (단순 top-N 고저가 아님).
  // 전체 200개 캔들(며칠치)을 다 뒤지면, 예전에 오래 횡보했던 옛날 가격대가
  // 카운트만 높다는 이유로 "가장 확실한 유동성"으로 잘못 뽑히는 문제가 있었음.
  // 최근 구간으로만 좁혀서 현재가와 무관한 과거 레벨이 끼어들지 않게 함.
  const liqWindow = data.slice(-60);
  const eqHighs = findEqualLevels(liqWindow, 'high');
  const eqLows  = findEqualLevels(liqWindow, 'low');
  // 클러스터가 하나도 없으면(전부 제각각이면) fallback으로 최근 고/저 1개씩 사용
  const bslLevels = eqHighs.length ? eqHighs.slice(-1) : [{price: Math.max(...liqWindow.map(c=>c.high)), count:1}];
  const sslLevels = eqLows.length  ? eqLows.slice(-1)  : [{price: Math.min(...liqWindow.map(c=>c.low)),  count:1}];

  if (layers.liq) {
    bslLevels.forEach(lv => {
      const l = addPriceLine(lv.price,'rgba(255,68,102,0.6)',1,LightweightCharts.LineStyle.Dashed,`BSL ×${lv.count}`);
      liqLines.push(l);
    });
    sslLevels.forEach(lv => {
      const l = addPriceLine(lv.price,'rgba(0,229,160,0.6)',1,LightweightCharts.LineStyle.Dashed,`SSL ×${lv.count}`);
      liqLines.push(l);
    });
  }

  // ── 구조/바이어스 분석 (실제 스윙 HH/HL vs LH/LL 비교) ──────
  const recent = data.slice(-30);
  let hh=0, ll=Infinity;
  recent.forEach(c => {
    if (c.high>hh) hh=c.high;
    if (c.low<ll)  ll=c.low;
  });
  // OTE/EQ 계산엔 위의 hh/ll(스윙 구간 전체 범위)을 그대로 쓰고,
  // 방향(상승/하락) 판단만 아래 스윙 포인트 비교로 새로 함.
  const swingWindow = data.slice(-60);
  const { highs: swHighs, lows: swLows } = findSwings(swingWindow, 2);
  let bias = '중립';
  if (swHighs.length>=2 && swLows.length>=2) {
    const higherHigh = swHighs[swHighs.length-1].price > swHighs[swHighs.length-2].price;
    const higherLow  = swLows[swLows.length-1].price  > swLows[swLows.length-2].price;
    if (higherHigh && higherLow) bias = '상승';        // HH + HL = 정상 상승 구조 (BOS)
    else if (!higherHigh && !higherLow) bias = '하락';  // LH + LL = 정상 하락 구조 (BOS)
    else bias = higherLow ? '상승' : '하락';            // 구조 전환 중(CHoCH) - 더 최근에 깨진 쪽을 따라감
  }

  // ── Premium/Discount 존 (OTE) ─────────────────────────
  // 스윙 저점~고점 구간의 50%(균형가) 및 61.8~79% 되돌림(최적 진입구간) 표시
  if (layers.ote && hh > ll) {
    const range = hh - ll;
    const t1 = recent[0].time, t2 = lastTime;
    const eq = ll + range*0.5;
    oteLines.push(addPriceLine(eq, 'rgba(200,200,224,0.5)', 1, D, 'EQ 50%'));

    // 상승 바이어스면 저점 쪽(디스카운트) OTE, 하락 바이어스면 고점 쪽(프리미엄) OTE
    let oteLow, oteHigh;
    if (bias === '하락') { oteLow = ll+range*0.618; oteHigh = ll+range*0.79; }
    else { oteLow = ll+range*0.21; oteHigh = ll+range*0.382; }
    const s = addBox(t1, t2, oteLow, oteHigh, 'rgba(180,80,255,0.15)', '#b450ff', 1);
    oteBoxes.push(s);
  }

  // ── 세션(킬존/AMD/실버불릿) 배지는 실시간 타이머로 별도 갱신됨 (updateSessionBadges) ──
  const amd = currentZones.amd || '-';

  // ── 저지 스윙(Judas Swing) 감지 ─────────────────────────
  // 킬존이 켜져있는 동안, 직전 봉이 최근 스윙 고/저를 찍고(가짜 돌파) 반대로 강하게 마감했는지 확인.
  // 여기에 거래량 조건을 추가: 진짜 저지스윙은 보통 그 스윕 캔들에서 거래량이 튀는 경우가 많아서,
  // 최근 평균 거래량 대비 확 튄 경우만 신호로 인정해 단순 되돌림과의 혼동을 줄인다.
  const judasBadge = document.getElementById('judasBadge');
  if (judasBadge) {
    judasBadge.className = 'judas-badge';
    // 킬존은 하루 중 몇 시간짜리 시간대 개념이라, 일봉/4H처럼 캔들 하나가
    // 몇 시간~하루를 통째로 담는 타임프레임에서는 저지스윙 판정이 의미가 없음.
    if (layers.judas && isLTF() && data.length>=2 && currentZones.anyKZ) {
      const prev = data[data.length-2], last = data[data.length-1];
      let judas = null;
      if (prev.high>=hh && last.close<prev.open && last.close<hh) judas = 'bear';
      else if (prev.low<=ll && last.close>prev.open && last.close>ll) judas = 'bull';

      // 거래량 확인: 직전 20개 캔들 평균 거래량 대비 스윕 캔들(prev)이 1.5배 이상인지
      let volOk = true; // 거래량 데이터가 없으면(과거 저장분 등) 조건 생략하고 가격 조건만으로 판정
      if (judas && typeof prev.volume === 'number') {
        const volWindow = data.slice(Math.max(0,data.length-22), data.length-2);
        if (volWindow.length >= 5) {
          const avgVol = volWindow.reduce((s,c)=>s+(c.volume||0),0)/volWindow.length;
          volOk = avgVol>0 && prev.volume >= avgVol*1.5;
        }
      }

      // 컨플루언스 확인: 스윕 지점이 실제로 감지된 BSL/SSL 유동성 레벨 근처(±0.2%)에서
      // 나온 건지 확인. 아무 자리에서나 튄 스파이크는 저지스윙으로 인정하지 않는다.
      let liqOk = true;
      if (judas) {
        const sweepPrice = judas==='bear' ? prev.high : prev.low;
        const pool = judas==='bear' ? bslLevels : sslLevels;
        liqOk = pool.some(lv => Math.abs(sweepPrice-lv.price)/lv.price*100 <= 0.2);
      }

      if (judas && volOk && liqOk) {
        judasBadge.classList.add('show', judas);
        judasBadge.textContent = judas==='bull' ? '⚡ 저지스윙(상승 반전)' : '⚡ 저지스윙(하락 반전)';
      }
    }
  }

  // 신호
  const sig = document.getElementById('signalBadge');
  sig.className = 'signal-badge';
  if (belowBull.length && bias==='상승') {
    sig.classList.add('show','buy'); sig.textContent='● 매수';
  } else if (aboveBear.length && bias==='하락') {
    sig.classList.add('show','sell'); sig.textContent='● 매도';
  } else {
    sig.classList.add('show','wait'); sig.textContent='⏳ 대기';
  }

  // 하단 스탯
  document.getElementById('statFVG').textContent = fvgBull.length+fvgBear.length;
  document.getElementById('statOB').textContent = obBull.length+obBear.length;
  document.getElementById('statLiq').textContent = bslLevels.length+sslLevels.length;

  const mssEl = document.getElementById('statMSS');
  const mssText = bias==='상승'?'상승':bias==='하락'?'하락':'중립';
  mssEl.textContent = mssText;
  mssEl.className = 'stat-val ' + (bias==='상승'?'bull':bias==='하락'?'bear':'neutral');

  const amdEl = document.getElementById('statAMD');
  amdEl.textContent = amd;
  amdEl.className = 'stat-val ' + (amd==='배분'?'bull':amd==='조작'?'bear':'neutral');

  const biasEl = document.getElementById('statBias');
  const biasText = bias==='상승'?'매수':bias==='하락'?'매도':'중립';
  biasEl.textContent = biasText;
  biasEl.className = 'stat-val '+(bias==='상승'?'bull':bias==='하락'?'bear':'neutral');

  computeStructureMarkers(data);
}

// ─── 4H OVERLAY ───────────────────────────────────────────
async function draw4H() {
  clearHTF();
  try {
    const htfData = await fetchCandles(currentSymbol, '4h');
    if (!htfData || htfData.length < 5) return;

    const recent = htfData.slice(-20);
    const D = LightweightCharts.LineStyle.Dashed;

    for (let i=1; i<recent.length-1; i++) {
      const p=recent[i-1], c=recent[i], n=recent[i+1];

      // 강세 OB
      if (c.close<c.open && n.close>n.open && n.close>c.high) {
        const lH = addPriceLine(c.high,'#00e5a0',2,D,'4H 강세OB');
        const lL = addPriceLine(c.low,'#00e5a0',2,D,'',false);
        htf4HLines.push(lH, lL);
      }
      // 약세 OB
      if (c.close>c.open && n.close<n.open && n.close<c.low) {
        const lH = addPriceLine(c.high,'#ffc800',2,D,'4H 약세OB');
        const lL = addPriceLine(c.low,'#ffc800',2,D,'',false);
        htf4HLines.push(lH, lL);
      }
      // 강세 FVG
      if (n.low > p.high) {
        const mid = (n.low+p.high)/2;
        const l = addPriceLine(mid,'#00b4ff',2,D,'4H FVG');
        htf4HLines.push(l);
      }
      // 약세 FVG
      if (n.high < p.low) {
        const mid = (n.high+p.low)/2;
        const l = addPriceLine(mid,'#ffc800',2,D,'4H FVG');
        htf4HLines.push(l);
      }
    }
  } catch(e) { console.warn('4H error:', e); }
}

// ─── 전일/주간 레벨 (PDH/PDL, 데일리/위클리 오픈) ─────────────
// currentTF와 무관하게 항상 1일봉을 따로 가져와서 계산한다.
async function drawDailyWeekly(myToken) {
  clearDW();
  if (!layers.dw) return;
  try {
    const daily = await fetchCandles(currentSymbol, '1d');
    // 그 사이 더 최신 loadChart()가 시작됐으면 이 결과는 버림 (경쟁 상태 방지)
    if (myToken !== undefined && myToken !== _loadToken) return;
    if (daily.length < 3) return;
    const D = LightweightCharts.LineStyle.Dashed;
    const today = daily[daily.length-1];
    const yesterday = daily[daily.length-2];

    dwLines.push(addPriceLine(yesterday.high, '#ffae00', 1, D, '전일 고가 PDH'));
    dwLines.push(addPriceLine(yesterday.low,  '#ffae00', 1, D, '전일 저가 PDL'));
    dwLines.push(addPriceLine(today.open, '#e0e0e0', 1, D, '데일리 오픈'));

    // 이번주 월요일(UTC 기준) 시가 찾기
    const now = new Date();
    const dow = now.getUTCDay(); // 0=일요일
    const diffToMon = (dow===0 ? 6 : dow-1);
    const monday = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()-diffToMon));
    const mondayTs = monday.getTime()/1000;
    const weekOpenCandle = daily.find(c => c.time >= mondayTs) || daily[0];
    dwLines.push(addPriceLine(weekOpenCandle.open, '#ff66ff', 1, D, '위클리 오픈'));
  } catch(e) { console.warn('daily/weekly levels error:', e); }
}

// ─── 세션 시간 계산 (뉴욕 현지시간 기준, DST 자동 반영) ─────────
// 고정 KST 시간대로 계산하면 런던/뉴욕 서머타임(DST) 전환 때마다 실제 킬존과
// 1시간씩 어긋나므로, Intl API로 각 거래소 "현지시간"을 직접 구해 계산한다.
function zoneHourDecimal(tz) {
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, hour: 'numeric', minute: 'numeric', hour12: false
  }).formatToParts(new Date());
  let h = parseInt(parts.find(p=>p.type==='hour').value, 10);
  const m = parseInt(parts.find(p=>p.type==='minute').value, 10);
  if (h === 24) h = 0;
  return h + m/60;
}
function inWindow(h, start, end) {
  return start < end ? (h>=start && h<end) : (h>=start || h<end);
}

// 30초마다 갱신되는 실시간 배지 (킬존/AMD/실버불릿). 캔들 데이터와 무관하게 항상 정확해야 함.
function updateSessionBadges() {
  const h = zoneHourDecimal('America/New_York'); // ICT 킬존은 전통적으로 뉴욕 현지시간 기준

  const zones = {
    asian:       inWindow(h, 20, 24),
    londonOpen:  inWindow(h, 2, 5),
    nyAM:        inWindow(h, 7, 10),
    londonClose: inWindow(h, 10, 12),
    sbAM:        inWindow(h, 10, 11),
    sbPM:        inWindow(h, 14, 15),
  };
  zones.anyKZ = zones.londonOpen || zones.nyAM || zones.londonClose;
  zones.amd = zones.asian ? '축적' : (zones.londonOpen||zones.londonClose) ? '조작' : zones.nyAM ? '배분' : '-';
  currentZones = zones;

  const kzBadge = document.getElementById('kzBadge');
  if (kzBadge) {
    kzBadge.className = 'kz-badge';
    if (zones.londonOpen || zones.londonClose) {
      kzBadge.classList.add('show','london');
      kzBadge.textContent = zones.londonOpen ? '🇬🇧 런던 오픈 킬존' : '🇬🇧 런던 클로즈 킬존';
    } else if (zones.nyAM) {
      kzBadge.classList.add('show','ny');
      kzBadge.textContent = '🇺🇸 뉴욕 킬존';
    } else if (zones.asian) {
      kzBadge.classList.add('show','ny');
      kzBadge.textContent = '🌏 아시안 세션';
    }
  }

  const amdBadge = document.getElementById('amdBadge');
  if (amdBadge) {
    amdBadge.className = 'amd-badge';
    if (zones.amd !== '-') { amdBadge.classList.add('show'); amdBadge.textContent = zones.amd; }
  }

  const sbBadge = document.getElementById('sbBadge');
  if (sbBadge) {
    sbBadge.className = 'sb-badge';
    if (zones.sbAM || zones.sbPM) {
      sbBadge.classList.add('show');
      sbBadge.textContent = '🥈 실버불릿 ' + (zones.sbAM ? 'AM' : 'PM');
    }
  }

  // AMD 하단 스탯도 실시간으로 함께 갱신
  const amdEl = document.getElementById('statAMD');
  if (amdEl) {
    amdEl.textContent = zones.amd;
    amdEl.className = 'stat-val ' + (zones.amd==='배분'?'bull':zones.amd==='조작'?'bear':'neutral');
  }
}

// ─── WEBSOCKET ────────────────────────────────────────────
function connectWS() {
  // 이 소켓이 어떤 심볼/TF용인지 고정해두고, 나중에 currentSymbol/currentTF가
  // 바뀌어도 이 소켓의 콜백이 잘못된 재연결이나 낡은 데이터 반영을 하지 않게 함
  const mySymbol = currentSymbol;
  const myTF = currentTF;

  if (wsReconnectTimer) { clearTimeout(wsReconnectTimer); wsReconnectTimer = null; }
  if (ws) { try { ws.onerror = null; ws.onclose = null; ws.onmessage = null; ws.close(); } catch(e){} ws = null; }
  _lastCandleTime = candles.length ? candles[candles.length-1].time : 0;
  const sym = mySymbol.toLowerCase();

  // kline(캔들 확정용) + aggTrade(실시간 체결가 갱신용)를 하나의 소켓으로 합쳐서 구독.
  // kline만 쓰면 바이낸스 서버가 초당 1번으로 묶어서 보내는 제한 때문에 화면이
  // "뚝뚝 튀는" 느낌이 남 — aggTrade는 체결이 일어날 때마다 오므로 그 사이를 채워준다.
  // (스팟 엔드포인트 유지 — 선물로 바꾸면 지금까지의 FVG/OB/BSL·SSL 값이 전부
  //  선물 가격 기준으로 바뀌므로, 그건 원할 때 별도로 결정할 부분)
  const streams = `${sym}@kline_${myTF}/${sym}@aggTrade`;
  // 선물 웹소켓도 같은 이유로 스팟으로 되돌림
  const socket = new WebSocket(`wss://stream.binance.com:9443/stream?streams=${streams}`);
  ws = socket;
  socket.onopen = () => console.log('WS connected:', sym, myTF);
  // 재연결은 onclose 한 곳에서만, 딱 한 번만 예약한다.
  // (onerror에서도 재연결을 걸면 브라우저가 error→close를 연달아 발생시켜
  //  같은 실패에 재연결이 2개씩 겹쳐 걸리고, 그게 반복되면서 소켓이 계속
  //  늘어나 캔들이 여러 스트림에서 따로 갱신되는 "차트 두 개" 버그가 났었음)
  socket.onerror = () => { if (ws === socket) ws = null; };
  socket.onclose = () => {
    if (ws !== socket) return; // 이미 다른 소켓으로 교체된 뒤라면 무시
    ws = null;
    // 그 사이 심볼/TF가 바뀌었으면 이 소켓 재연결은 의미 없음 (새 소켓이 이미 연결됨)
    if (mySymbol !== currentSymbol || myTF !== currentTF) return;
    wsReconnectTimer = setTimeout(() => {
      wsReconnectTimer = null;
      if (!ws && mySymbol === currentSymbol && myTF === currentTF) connectWS();
    }, 3000);
  };
  socket.onmessage = (e) => {
    if (ws !== socket) return; // 이미 교체된 낡은 소켓이면 무시
    const msg = JSON.parse(e.data);
    if (!msg.stream) return;
    if (msg.stream.endsWith('@kline_' + myTF)) {
      const d = msg.data.k;
      handleCandle({
        time: d.t/1000,
        open: parseFloat(d.o),
        high: parseFloat(d.h),
        low:  parseFloat(d.l),
        close:parseFloat(d.c),
        volume:parseFloat(d.v),
      }, d.x);
    } else if (msg.stream.endsWith('@aggTrade')) {
      const price = parseFloat(msg.data.p);
      if (!price || !candles.length) return;
      // 아직 진행 중인(닫히지 않은) 마지막 캔들의 종가만 실시간으로 살짝 갱신.
      // 캔들 확정(닫힘)이나 배열 추가는 여전히 kline 메시지 쪽에서만 처리.
      const last = candles[candles.length - 1];
      const updated = {
        time: last.time,
        open: last.open,
        high: Math.max(last.high, price),
        low: Math.min(last.low, price),
        close: price,
        volume: last.volume,
      };
      _codeUpdating = true;
      candleSeries.update(updated);
      _codeUpdating = false;
      updatePrice(updated);
    }
  };
}

let _lastCandleTime = 0;
function handleCandle(candle, isClosed) {
  // 과거 시간 캔들이거나 비정상 데이터면 무시
  if (candle.time < _lastCandleTime) return;
  if (!candle.open || !candle.high || !candle.low || !candle.close) return;
  if (candle.high < candle.low) return;
  _lastCandleTime = candle.time;
  _codeUpdating = true;
  candleSeries.update(candle);
  _codeUpdating = false;
  updatePrice(candle);
  if (isClosed) {
    candles.push(candle);
    if (candles.length > 300) candles.shift();
    saveAndRestore(() => analyzeAndDraw(candles));
  }
}

// ─── PRICE DISPLAY ────────────────────────────────────────
function updatePrice(candle) {
  const el = document.getElementById('priceMain');
  const chEl = document.getElementById('priceChange');
  const price = candle.close;
  el.textContent = price > 1000
    ? price.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})
    : price.toFixed(4);
  if (openPrice) {
    const chg = ((price-openPrice)/openPrice*100).toFixed(2);
    chEl.textContent = (chg>=0?'+':'')+chg+'%';
    chEl.style.color = chg>=0?'#00e5a0':'#ff4466';
  }
}

// ─── CONTROLS ─────────────────────────────────────────────
function changeSymbol(sym, btn) {
  document.querySelectorAll('.sym-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentSymbol = sym;
  loadChart();
}

function changeTF(tf, btn) {
  if (tf === currentTF) return;
  document.querySelectorAll('.tf-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentTF = tf;
  loadChart();
}

function toggleHTF() {
  htfOn = !htfOn;
  const el = document.getElementById('leg-htf');
  if (el) el.classList.toggle('off', !htfOn);
  if (htfOn && isLTF()) saveAndRestore(() => draw4H());
  else clearHTF();
}

function toggleLayer(name) {
  layers[name] = !layers[name];
  const legMap = {
    fvgBull:'leg-fvg-bull', fvgBear:'leg-fvg-bear',
    obBull:'leg-ob-bull', obBear:'leg-ob-bear',
    liq:'leg-liq', ote:'leg-ote', dw:'leg-dw', structure:'leg-structure',
  };
  const el = document.getElementById(legMap[name]);
  if (el) el.classList.toggle('off', !layers[name]);
  if (name === 'dw') { drawDailyWeekly(); return; }
  saveAndRestore(() => analyzeAndDraw(candles));
}

// 우측 하단 실시간 시계 (트레이딩뷰 스타일)
function updateClock() {
  const el = document.getElementById('clockOverlay');
  if (!el) return;
  const s = new Intl.DateTimeFormat('en-GB', {
    timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
  }).format(new Date());
  el.textContent = `${s} KST`;
}

// ─── INIT ─────────────────────────────────────────────────
initChart();
loadChart();
updateSessionBadges();
setInterval(updateSessionBadges, 30000);
updateClock();
setInterval(updateClock, 1000);

// 몇 초마다 FVG/OB/BSL·SSL 등을 자동으로 다시 그려서, 어쩌다 한 번씩 선이
// 안 보이는 상황이 생겨도 사용자가 버튼을 눌러 새로고침할 필요 없이 자동 복구되게 함.
setInterval(() => {
  if (candles && candles.length) saveAndRestore(() => analyzeAndDraw(candles));
}, 5000);
</script>
